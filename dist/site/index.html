@keyframes hkSchweiss2 { 0%, 20% { opacity: 0; transform: none; } 30% { opacity: .9; } 100% { opacity: 0; transform: translateY(40px); } }
@keyframes hkZucken { 20% { transform: translateX(-6px) rotate(-3deg); } 45% { transform: translateX(5px) rotate(2deg); } 70% { transform: translateX(-3px); } }
@keyframes hkMundAuf { 0%, 16%, 100% { transform: none; } 22%, 85% { transform: scale(.8, 1.5); } }
/* gaehnt: Augen fallen halb zu, der Mund geht weit auf, der Kopf sackt kurz weg */
.hacker.gaehnt.da .hk-auge-l, .hacker.gaehnt.da .hk-auge-r { animation: hkMuede 3.8s .5s both; }
.hacker.gaehnt.da .hk-braue-l, .hacker.gaehnt.da .hk-braue-r { animation: hkBraueRunter 3.8s .5s both; }
.hacker.gaehnt.da .hk-mund { transform-origin: center; animation: hkGaehnen 3.8s .5s both; }
.hacker.gaehnt.da .hk-kopf { animation: hkSchlapp 3.8s .5s both; }
@keyframes hkMuede { 0%, 12%, 100% { transform: scaleY(1); } 22%, 85% { transform: scaleY(.35); } }
@keyframes hkBraueRunter { 0%, 12%, 100% { transform: none; } 22%, 85% { transform: translateY(5px); } }
@keyframes hkGaehnen { 0%, 16%, 100% { transform: none; } 30%, 58% { transform: scale(.85, 2.1); } 72%, 88% { transform: scale(.95, 1.2); } }
@keyframes hkSchlapp { 0%, 14%, 100% { transform: none; } 30%, 80% { transform: rotate(-5deg) translateY(5px); } }
/* Sprechblase: darf umbrechen – die Sätze zu den Anrufen sind länger als in der Phishing Challenge */
.hacker-blase { position: absolute; left: 74%; top: 3%; transform: rotate(-8deg) scale(0); transform-origin: 0 100%;
  transition: transform .45s cubic-bezier(.175, .885, .32, 1.275); }
.hacker.da .hacker-blase { transform: rotate(-8deg) scale(1); transition-delay: .55s; }
.hacker:not(.da) .hacker-blase { transition: transform 0s .45s; }   /* Blase fährt mit hinaus */
.hacker-blase span { display: block; width: max-content; max-width: min(340px, calc(100vw - 120px)); padding: 11px 18px; border-radius: 24px 24px 24px 6px; background: #0F0820; color: #fff;
  font-weight: 800; font-size: clamp(.95rem, .4vw + .75rem, 1.08rem); line-height: 1.35; border: 1.5px solid rgba(255, 0, 128, .75);
  box-shadow: 0 12px 30px -5px rgba(0, 0, 0, .8), 0 0 16px rgba(255, 0, 128, .35); }
.hacker.aergert .hacker-blase span { border-color: rgba(56, 189, 248, .75); box-shadow: 0 12px 30px -5px rgba(0, 0, 0, .8), 0 0 16px rgba(56, 189, 248, .35); }
.hacker.gaehnt .hacker-blase span { border-color: rgba(174, 155, 255, .75); box-shadow: 0 12px 30px -5px rgba(0, 0, 0, .8), 0 0 16px rgba(174, 155, 255, .35); }
/* die Beute oben ist ein Knopf: ein Klick holt den Hacker */
.hud-beute { cursor: pointer; }
.hud-beute:hover { transform: scale(1.05); }
.hud-beute:active { transform: scale(.97); }

/* schmal: nur der aktive Hinweis steht da und gleitet seitlich weiter */
@keyframes hinweisVonRechts { from { opacity: 0; transform: translateX(56px); } }
@keyframes hinweisVonLinks { from { opacity: 0; transform: translateX(-56px); } }
@keyframes hinweisNachLinks { to { opacity: 0; transform: translateX(-56px); } }
@keyframes hinweisNachRechts { to { opacity: 0; transform: translateX(56px); } }

/* ================= Transkript links beim Gerät (Feedback, ab „Details anzeigen“) =================
   Im Gespräch steht das Transkript rechts über den Antworten. Bei „Details anzeigen“ rückt das Telefon
   nach links und der Gesprächsverlauf steht daneben; bei Teams (breit) rückt das Fenster nach oben und
   der Verlauf steht darunter. Er zeigt alles (auch ohne Live-Untertitel) und markiert die Stelle zum
   aktiven Hinweis; ein Klick auf eine markierte Stelle öffnet ihren Hinweis. */
.geraet-spalte.mit-transkript { flex-direction: row; align-items: center; gap: clamp(14px, 1.6vw, 26px); }
.mit-transkript .geraet { flex: 0 0 auto; width: auto; height: 100%; container-type: normal; }
.mit-transkript .phone { height: min(680px, calc(100dvh - var(--hud-h) - 80px)); }
.mit-transkript .cc { flex: 1 1 0; max-width: 440px; min-width: 240px; height: min(620px, 100%); }
.mit-transkript .ablehnen-tipp { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: max-content; max-width: 100%; }
.mit-transkript:has(.geraet[data-art="teams"]) { flex-direction: column; }
.mit-transkript:has(.geraet[data-art="teams"]) .geraet { flex: 1 1 0; min-height: 0; width: 100%; height: auto; container-type: size; }
.mit-transkript:has(.geraet[data-art="teams"]) .cc { flex: 0 0 auto; width: min(100%, 900px); max-width: none; height: 32%; min-height: 150px; }
.geraet.spricht ~ .cc .cc-punkt { background: var(--rot); animation: blink 1s steps(2) infinite; }
.cc-titel { display: none; font: 700 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--text-2); padding: 7px 0; }
#s-spiel[data-phase="feedback"] .cc-titel { display: inline; }
#s-spiel[data-phase="feedback"] .cc-schalter, #s-spiel[data-phase="feedback"] .cc-nochmal { display: none; }
#s-spiel[data-fb-stufe="2"] .cc-mark { cursor: pointer; }
#s-spiel[data-fb-stufe="2"] .cc-mark:hover { background: color-mix(in srgb, var(--c) 18%, transparent); }
/* im Feedback ist das Gerät nicht mehr abgedunkelt; was ein Hinweis am Gerät meint, leuchtet mit auf */
#s-spiel[data-fb-stufe="2"] .geraet[data-zustand="ende"] .phone, #s-spiel[data-fb-stufe="2"] .geraet[data-zustand="ende"] .win { filter: none; }
.ziel-aktiv { --c: #FF6B81; outline: 2px solid var(--c); outline-offset: 4px; box-shadow: 0 0 24px -2px var(--c); animation: zielPuls 1.6s ease-in-out infinite; }
.ziel-aktiv:not(.ph-avatar) { border-radius: 8px; }
.ziel-aktiv.m-gruen { --c: var(--mint); }
.ziel-aktiv.m-info { --c: #AE9BFF; }
@keyframes zielPuls { 50% { outline-offset: 7px; } }
/* Teams (breit): das Fenster rückt ganz nach oben, bündig mit dem Panel rechts, und wird kleiner; der Verlauf darunter ist
   genauso breit und bekommt den Rest der Höhe. --win-h = Höhe des Fensters (die Hälfte der Spalte, höchstens so hoch, wie die Breite erlaubt). */
@media (min-width: 960px) and (min-height: 541px) {
  .mit-transkript:has(.geraet[data-art="teams"]) { justify-content: flex-start; container-type: size; --win-h: min(clamp(200px, 50cqh, 500px), min(100cqw, 900px) * 10.5 / 16); }
  .mit-transkript:has(.geraet[data-art="teams"]) .geraet { flex: none; height: var(--win-h); }
  .mit-transkript:has(.geraet[data-art="teams"]) .cc { flex: 1 1 0; height: auto; min-height: 0; width: calc(var(--win-h) * 16 / 10.5); max-width: 100%; }
}
/* mittelgroße Fenster: neben Telefon und Panel ist kein Platz – dann steht nur der Verlauf links */
@media (min-width: 960px) and (max-width: 1099px) and (min-height: 541px) {
  #s-spiel[data-fb-stufe="2"] .geraet { display: none; }
  #s-spiel[data-fb-stufe="2"] .mit-transkript .cc { flex: 0 1 auto; width: 100%; max-width: 600px; height: min(620px, 100%); }
}
.cc-mark { --c: #FF6B81; color: inherit; background: none; border-radius: 5px; padding: 1px 3px; margin: 0 -3px; -webkit-box-decoration-break: clone; box-decoration-break: clone;
  box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--c) 65%, transparent); transition: background .3s, box-shadow .3s; }
.cc-mark.m-gruen { --c: var(--mint); }
.cc-mark.m-info { --c: #AE9BFF; }
.cc-mark.aktiv { background: color-mix(in srgb, var(--c) 30%, transparent); box-shadow: 0 0 0 2px var(--c), 0 0 22px -4px var(--c); }

/* ================= Schmal: alles untereinander (Lage – Gerät – Gespräch) ================= */
@media (max-width: 959px), (max-height: 540px) {
  .screen-spiel { overflow-y: auto; }
  .buehne { height: auto; min-height: 100%; display: flex; flex-direction: column; align-items: stretch; gap: 12px; padding: 4px 14px 24px; }
  .lage { order: 1; padding: 14px 16px; gap: 6px; }
  .geraet-spalte { order: 2; height: auto; }
  .dialog { order: 3; }
  .lage-titel { font-size: 1.15rem; }
  .lage-text { font-size: .9rem; }
  .lage.zu .lage-text { display: none; }
  .lage-toggle { display: block; position: absolute; right: 12px; top: 10px; padding: 6px 10px; border-radius: 99px; box-shadow: inset 0 0 0 1px var(--kante-2); color: var(--text-2); font-size: .7rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
  .lage-toggle::after { content: " ▾"; }
  .lage.zu .lage-toggle::after { content: " ▸"; }
  .lage-kopf { padding-right: 80px; }
  .geraet { height: auto; flex: none; }
  .phone { height: min(620px, 72vh); }
  .dialog { align-content: start; }
  .cc { flex: none; max-height: none; min-height: 120px; }
  .cc-log { max-height: 40vh; }
  /* Transkript beim Gerät: untereinander; beim Feedback steht der Verlauf statt des Geräts über dem Panel */
  .geraet-spalte.mit-transkript, .mit-transkript:has(.geraet[data-art="teams"]) { flex-direction: column; align-items: stretch; }
  .geraet, .mit-transkript .geraet, .mit-transkript:has(.geraet[data-art="teams"]) .geraet { flex: none; width: 100%; height: auto; container-type: normal; }
  .phone { max-width: 100%; }
  .win { width: min(100%, 780px); }
  .mit-transkript .phone { height: min(620px, 72vh); }
  .mit-transkript .cc, .mit-transkript:has(.geraet[data-art="teams"]) .cc { flex: none; width: 100%; max-width: none; height: auto; min-height: 120px; }
  #s-spiel[data-fb-stufe="1"] .geraet-spalte { display: none; }
  #s-spiel[data-fb-stufe="2"] .geraet { display: none; }
  #s-spiel[data-fb-stufe="2"] .cc-log { max-height: 34vh; }
  /* Feedback: das Panel füllt den Bildschirm, der Knopf klebt unten */
  .fb { order: 4; flex: 1 0 auto; overflow: visible; width: 100%; max-width: 680px; align-self: center; }
  .h-liste { position: relative; }
  .h-karte:not(.aktiv) { display: none; }
  .h-karte { animation: none; }
  .h-body { transition: none; }
  .h-karte.aktiv { animation: hinweisVonRechts .38s var(--ease) both; }
  .h-karte.aktiv.von-links { animation-name: hinweisVonLinks; }
  .h-karte.geht { display: block; position: absolute; left: 0; right: 0; top: 0; z-index: 1; pointer-events: none; animation: hinweisNachLinks .34s var(--ease) forwards; }
  .h-karte.geht.nach-rechts { animation-name: hinweisNachRechts; }
  .h-karte.geht .h-body { grid-template-rows: 1fr; }
  .h-chev { display: none; }
}
@media (max-width: 760px) {
  :root { --hud-h: 60px; }
  #hud-titel { display: none; }
  .hud-marke { padding-right: 7px; }
  .app[data-screen="s-spiel"] .hud-marke, .app[data-screen="s-levelende"] .hud-marke, .app[data-screen="s-level"] .hud-marke { display: none; }
  .hud-level { display: none; }
  .hud-fortschritt { padding: 0 14px; }
  .hb-text small { display: none; }
  .icon-btn { width: 40px; height: 40px; }
  .hud-pille { height: 42px; }
  .hud-rechts { gap: 6px; }
  /* kompaktes Telefon: eine Karte statt Mockup */
  .phone { height: auto; aspect-ratio: auto; width: 100%; border-radius: 22px; box-shadow: 0 0 0 1px #3a3168, 0 20px 50px -20px rgba(0,0,0,.8); grid-template-rows: auto auto auto; min-height: 150px; }
  .phone-status { display: none; }
  .phone-sperre { padding: 16px 14px; grid-template-columns: auto 1fr; align-items: baseline; justify-items: start; column-gap: 12px; }
  .sperre-uhr { font-size: 36px; }
  .phone-anruf { grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "av kanal" "av name" "av zeile" "av timer"; justify-items: start; text-align: left; padding: 16px 18px 8px; column-gap: 16px; row-gap: 2px; align-items: center; }
  .ph-kanal { grid-area: kanal; margin: 0; }
  .phone-anruf .ph-avatar-wrap { grid-area: av; width: 96px; margin: 0; }
  .ph-name { grid-area: name; font-size: 21px; }
  .ph-zeile { grid-area: zeile; }
  .ph-timer { grid-area: timer; margin: 2px 0 0; }
  .phone-tasten { padding: 6px 18px 16px; justify-content: center; gap: 36px; }
  .rund { width: 56px; height: 56px; }
  .rund-deko { display: none; }
  .win { aspect-ratio: 16 / 12; }
  .win-toast { left: 12px; right: 12px; width: auto; bottom: 12px; }
  .cc-zeile p { font-size: 16px; }
  .regel-punkte, .pause-optionen, .f-raster { grid-template-columns: minmax(0, 1fr); }
  .nugget-karte { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .nk-bild { order: -1; }
  .urteil-btn kbd { display: none; }
  .mit-transkript .phone { height: auto; }
  #s-spiel[data-fb-stufe="1"] .geraet-spalte { display: flex; }   /* das kompakte Telefon bleibt in Schritt 1 als Kontext */
  /* Feedback: in Schritt 2 nur noch Ergebnis und Hinweise */
  .fb { --pad: 16px; border-radius: 24px; }
  .fb-ikon { width: 44px; height: 44px; }
  .fb-titel { font-size: 1.45rem; }
  .fb-wahr { font-size: .9rem; margin-top: 2px; }
  .fb-kern { margin: 12px 0 14px; padding: 10px 12px 11px 14px; }
  .fb-kern p { font-size: .95rem; }
  .fb[data-stufe="2"] .fb-wahr, .fb[data-stufe="2"] .fb-kern { display: none; }
  .fb[data-stufe="2"] .fb-hinweise { margin-top: 14px; }
  .h-kopf { padding: 10px 12px; }
  .h-body p { padding: 0 14px 14px 54px; }
  .fb-aktionen { flex-direction: row-reverse; align-items: center; gap: 6px; padding-top: 12px; }
  /* Knopf und Link nebeneinander: der Link bricht um (zweizeilig, so schmal wie sein längstes Wort), damit der Knopf Platz hat;
     wird der Knopftext lang (auch in anderen Sprachen), bricht auch er um */
  .fb-aktionen .btn { flex: 1 1 auto; width: auto; min-height: 54px; padding: 6px 16px; text-wrap: balance; }
  .link-btn { flex: 0 1 min-content; padding: 8px 6px; font-size: .78rem; line-height: 1.3; text-align: center; text-wrap: balance; }
  .link-btn.weg { display: none; }
  .hacker { width: 118px; top: 13%; }
  .hacker-blase span { font-size: .85rem; padding: 8px 13px; }
  .f-kopf { flex-direction: column; text-align: center; gap: 18px; }
  .f-zahlen { justify-content: center; }
  .sternenflug { opacity: .6; }
  .sternenflug .flieg:nth-of-type(n+6) { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

</style>
</head>
<body>
<div id="app" class="app" data-screen="s-start">

  <!-- ruhiger Hintergrund wie in der Phishing Challenge: zwei schwache Lichter (Petrol links, Magenta rechts);
       beim Sicherheitstipp Navy mit blauem Schimmer -->
  <div class="bg" aria-hidden="true">
    <div class="bg-quiz"></div>
    <div class="bg-tipp"></div>
  </div>

  <!-- HUD wie in der Serie: Marke links, rechts Hacker-Kasse, Fortschritt, Ton -->
  <header class="hud" id="hud">
    <div class="hud-pille hud-marke">
      <img class="hud-logo" src="assets/hacker-face.png" alt="">
      <span id="hud-titel"></span>
    </div>
    <div class="hud-rechts">
      <button class="hud-pille hud-beute" id="hud-beute" type="button" hidden title="Hacker-Beute">
        <img src="assets/hacker-face.png" alt="">
        <span class="hb-text"><small id="hud-beute-label"></small><b id="hud-beute-wert">0 €</b></span>
      </button>
      <div class="hud-pille hud-fortschritt" id="hud-fortschritt" hidden>
        <span class="hud-level" id="hud-level"></span>
        <span class="hud-frage"><span id="hud-anruf"></span><span class="hud-segmente" id="hud-punkte"></span></span>
      </div>
      <button class="icon-btn" id="btn-ton" type="button" aria-pressed="true" title="Ton">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="ton-an" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="ton-aus" d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
    </div>
  </header>

  <main class="buehne-app" id="buehne-app">

  <!-- ============ Start ============ -->
  <section id="s-start" class="screen screen-start zentriert" aria-labelledby="start-titel">
    <div class="sternenflug" id="sternenflug" aria-hidden="true"></div>
    <div class="inhalt start">
      <h1 id="start-titel" class="mega"></h1>
      <div class="start-visual" aria-hidden="true">
        <canvas id="start-welle" class="welle"></canvas>
        <div class="welle-labels"><span>Echt</span><span>Fake</span></div>
      </div>
      <p class="lead" id="start-kern"></p>
      <div class="start-aktion"><button id="start-los" class="btn btn-gross btn-mint btn-winkt" type="button"></button></div>
      <ul class="start-fakten" id="start-fakten"></ul>
    </div>
  </section>

  <!-- ============ Intro ============ -->
  <section id="s-intro" class="screen screen-intro" hidden>
    <p class="kit-kopf" id="kit-kopf"><i></i><span></span></p>
    <div class="intro-buehne">
      <div class="beat" id="beat">
        <h2 class="beat-gross" id="beat-gross"></h2>
        <div class="beat-medium" id="beat-medium">
          <div class="rec" id="rec">
            <div class="rec-kopf"><span class="rec-punkt"></span><span>REC</span><b id="rec-zeit">00:00.0</b></div>
            <canvas id="rec-welle" class="rec-welle" aria-hidden="true"></canvas>
          </div>
        </div>
        <p class="beat-klein" id="beat-klein"></p>
        <p class="beat-ergebnis" id="beat-ergebnis"></p>
      </div>
    </div>
    <button id="intro-skip" class="btn-text skip" type="button"></button>
  </section>

  <!-- ============ Level-Start ============ -->
  <section id="s-level" class="screen screen-level zentriert" hidden>
    <div class="inhalt intro-level">
      <div><span class="pille-kicker" id="lv-kicker"></span></div>
      <div class="lv-icon" id="lv-icon"></div>
      <h1 class="titel-gross" id="lv-titel"></h1>
      <p class="untertitel" id="lv-unter"></p>
      <div class="lv-info" id="lv-info"></div>
      <button class="btn btn-gross btn-mint" id="lv-los" type="button"></button>
    </div>
  </section>

  <!-- ============ Spiel: links das Gerät, rechts oben die Lage, darunter die Live-Untertitel ============ -->
  <section id="s-spiel" class="screen screen-spiel" hidden>
    <div class="buehne" id="buehne">
      <!-- Gerät -->
      <div class="geraet-spalte">
        <div class="geraet" id="geraet" data-art="phone" data-zustand="ruhe">
          <!-- Telefon -->
          <div class="phone">
            <div class="phone-status"><span id="ph-uhr">16:52</span><span class="phone-notch"></span><span class="phone-icons"><i></i><i></i><i></i></span></div>
            <div class="phone-sperre">
              <span class="sperre-uhr" id="ph-sperre-uhr"></span>
              <span class="sperre-datum" id="ph-sperre-datum"></span>
            </div>
            <div class="phone-anruf">
              <p class="ph-kanal" id="ph-kanal"></p>
              <div class="ph-avatar-wrap">
                <canvas class="ph-ring" id="ph-ring" width="320" height="320" aria-hidden="true"></canvas>
                <div class="ph-avatar" id="ph-avatar"></div>
              </div>
              <p class="ph-name" id="ph-name"></p>
              <p class="ph-zeile" id="ph-zeile"></p>
              <p class="ph-timer" id="ph-timer"></p>
            </div>
            <div class="phone-tasten phone-tasten-ring">
              <div class="taste"><button class="rund rund-nein" id="ph-ablehnen" type="button" aria-label="Ablehnen"><svg class="ico" viewBox="0 0 24 24"><path class="fill" d="M3.5 13.6c4.7-4.1 12.3-4.1 17 0l-1.8 2.5c-.4.5-1.1.6-1.6.3l-2.2-1.3c-.4-.2-.6-.7-.5-1.1l.3-1.6a10.6 10.6 0 0 0-5.4 0l.3 1.6c.1.4-.1.9-.5 1.1l-2.2 1.3c-.5.3-1.2.2-1.6-.3z"/></svg></button><span>Ablehnen</span></div>
              <div class="taste"><button class="rund rund-ja" id="ph-annehmen" type="button" aria-label="Annehmen"><svg class="ico" viewBox="0 0 24 24"><path class="fill" d="M6.6 3.2 8.8 5c.4.3.5.9.3 1.4L8 8.8a12 12 0 0 0 7.2 7.2l2.4-1.1c.5-.2 1-.1 1.4.3l1.8 2.2c.4.5.3 1.2-.2 1.6l-1.6 1.3c-.9.7-2.1.9-3.1.5A18.4 18.4 0 0 1 3.2 8.2c-.4-1-.2-2.2.5-3.1L5 3.4c.4-.5 1.1-.6 1.6-.2z"/></svg></button><span>Annehmen</span></div>
            </div>
            <div class="phone-tasten phone-tasten-talk">
              <span class="rund rund-deko" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
              <button class="rund rund-nein" id="ph-auflegen" type="button" aria-label="Auflegen"><svg class="ico" viewBox="0 0 24 24"><path class="fill" d="M3.5 13.6c4.7-4.1 12.3-4.1 17 0l-1.8 2.5c-.4.5-1.1.6-1.6.3l-2.2-1.3c-.4-.2-.6-.7-.5-1.1l.3-1.6a10.6 10.6 0 0 0-5.4 0l.3 1.6c.1.4-.1.9-.5 1.1l-2.2 1.3c-.5.3-1.2.2-1.6-.3z"/></svg></button>
              <span class="rund rund-deko" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></span>
            </div>
          </div>

          <!-- Teams-artiges Fenster: vor dem Anruf der Posteingang, im Anruf das Anruffenster
               (Steuerung oben rechts wie im aktuellen Teams, Name unten links in der Kachel) -->
          <div class="win">

        var r = ver === '2004' ? api.Initialize('') : api.LMSInitialize('');
        offen = r === true || r === 'true';
      } catch (e) { offen = false; }
      if (!offen) { api = null; return false; }
      var k = K[ver];
      var st = hole(k.status);
      istFertig = /passed|completed/.test(st) || (ver === '2004' && hole(k.erfolg) === 'passed');
      // Solange nicht alle Levels bestanden sind, bleibt der Kurs „incomplete“ – nie „completed“
      if (!istFertig) {
        if (ver === '2004') setze(k.status, 'incomplete');
        else if (st === '' || st === 'not attempted' || st === 'unknown') setze(k.status, 'incomplete');
      }
      setze(k.exit, 'suspend');
      try { interaktionen = parseInt(hole('cmi.interactions._count'), 10) || 0; } catch (e) {}
      commit();
      return true;
    },
    aktiv: function () { return !!api; },
    version: function () { return ver; },

    laden: function () {
      if (!api) return null;
      var roh = hole(K[ver].daten);
      if (!roh) return null;
      try { return JSON.parse(roh); } catch (e) { return null; }
    },
    speichern: function (stand, ort) {
      if (!api) return;
      setze(K[ver].daten, JSON.stringify(stand));
      if (ort) setze(K[ver].ort, ort);
      commit();
    },

    // Ein Urteil als Interaktion (für Auswertungen im LMS)
    interaktion: function (id, antwort, richtigeAntwort, korrekt) {
      if (!api) return;
      var n = interaktionen++, p = 'cmi.interactions.' + n + '.';
      setze(p + 'id', id);
      setze(p + 'type', 'choice');
      setze(p + 'correct_responses.0.pattern', richtigeAntwort);
      if (ver === '2004') {
        setze(p + 'learner_response', antwort);
        setze(p + 'result', korrekt ? 'correct' : 'incorrect');
        setze(p + 'timestamp', new Date().toISOString().slice(0, 19));
      } else {
        setze(p + 'student_response', antwort);
        setze(p + 'result', korrekt ? 'correct' : 'wrong');
        setze(p + 'time', new Date().toTimeString().slice(0, 8));
      }
      commit();
    },

    // Fortschritt 0…1 (bestandene Level / alle Level). Nur SCORM 2004 hat dafür ein Feld.
    fortschritt: function (anteil) {
      if (!api || ver !== '2004') return;
      setze('cmi.progress_measure', String(Math.round(Math.max(0, Math.min(1, anteil)) * 100) / 100));
      commit();
    },

    // Alle Levels bestanden: Punktzahl + Status (2004: completed + passed, 1.2: passed)
    abschliessen: function (prozent, bestanden) {
      if (!api) return false;
      var k = K[ver], p = Math.round(prozent);
      // Ein früheres "passed" nie verschlechtern
      if (!(istFertig && !bestanden)) {
        setze(k.min, '0'); setze(k.max, '100'); setze(k.raw, String(p));
        if (ver === '2004') {
          setze(k.skaliert, String(p / 100));
          setze(k.status, bestanden ? 'completed' : 'incomplete');
          setze(k.erfolg, bestanden ? 'passed' : 'failed');
        } else {
          setze(k.status, bestanden ? 'passed' : 'incomplete');
        }
      }
      if (bestanden) istFertig = true;
      setze(k.exit, ver === '2004' ? 'normal' : '');
      commit();
      return true;
    },

    beenden: function () {
      if (!api || beendet) return;
      beendet = true;
      var k = K[ver], ms = Date.now() - start;
      setze(k.zeit, ver === '2004' ? dauer2004(ms) : dauer12(ms));
      commit();
      try { if (ver === '2004') api.Terminate(''); else api.LMSFinish(''); } catch (e) {}
    }
  };
})();

<script>
/* ------------------------------------------------------------
   Klang — alles, was man hört.
   Web Audio für alles: Musik, Stimmen (durch einen Telefonfilter
   je nach Kanal), Atmo, Klingeltöne und die synthetischen
   UI-Geräusche. Stimmen werden vorab dekodiert; die Stille, die
   ElevenLabs v3 ans Ende hängt, schneiden wir beim Abspielen ab.
   ------------------------------------------------------------ */
(function () {
  const PFAD = {
    musik: n => 'assets/musik/' + n + '.mp3',
    sfx: n => 'assets/sfx/' + n + '.mp3',
    stem: n => 'assets/stem/' + n + '.mp3'
  };

  // Färbung der Leitung: Hochpass / Tiefpass / leichte Sättigung
  const LEITUNG = {
    telefon: { hp: 320, lp: 3300, drive: 0.35, gain: 1.15 },
    messenger: { hp: 140, lp: 7200, drive: 0.12, gain: 1.0 },
    teams: { hp: 90, lp: 9500, drive: 0.06, gain: 1.0 },
    erzaehler: { hp: 40, lp: 18000, drive: 0, gain: 1.0 }
  };

  const ATMO_VOL = { callcenter: 0.16, helpdesk: 0.09, homeoffice: 0.13 };

  let ctx = null, master = null, musikBus = null, stimmBus = null, analyser = null, sfxBus = null;
  let an = true;
  const puffer = {};          // url -> Promise<{buf, start, ende}>
  let musikQuelle = null, musikGain = null, musikName = null, musikZiel = 0;
  let duckFaktor = 1;
  let atmoQuelle = null, atmoGain = null;
  let ringQuelle = null, ringGain = null, vibTimer = null, vibQuellen = [];
  let aktiveStimme = null;
  const pegelDaten = new Float32Array(1024);

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* älteres Safari */ }
    master = ctx.createGain(); master.gain.value = an ? 1 : 0; master.connect(ctx.destination);
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.25;
    comp.connect(master);
    musikBus = ctx.createGain(); musikBus.gain.value = 1; musikBus.connect(comp);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.8; sfxBus.connect(comp);
    stimmBus = ctx.createGain(); stimmBus.gain.value = 1;
    analyser = ctx.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.6;
    stimmBus.connect(analyser); analyser.connect(comp);
    // stiller Puffer als Wecker (iOS)
    const b = ctx.createBuffer(1, 1, 22050); const s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0);
  }

  function setAn(wert) {
    an = wert;
    if (master) master.gain.setTargetAtTime(an ? 1 : 0, ctx.currentTime, 0.05);
  }

  /* ---------- Laden ---------- */
  function laden(url) {
    if (puffer[url]) return puffer[url];
    puffer[url] = fetch(url)
      .then(r => { if (!r.ok) throw new Error(url + ' ' + r.status); return r.arrayBuffer(); })
      .then(ab => new Promise((ok, nein) => { init(); ctx.decodeAudioData(ab, ok, nein); }))
      .then(buf => {
        const d = buf.getChannelData(0), sr = buf.sampleRate, schwelle = 0.02;
        let a = 0; while (a < d.length && Math.abs(d[a]) < schwelle) a++;
        let e = d.length - 1; while (e > a && Math.abs(d[e]) < schwelle) e--;
        const start = Math.max(0, a / sr - 0.06), ende = Math.min(buf.duration, e / sr + 0.28);
        return { buf, start, ende, huelle: sprechHuelle(d, sr, start, ende) };
      })
      .catch(err => { console.warn('Audio fehlt:', err.message); delete puffer[url]; return null; });
    return puffer[url];
  }
  // Kumulierter Sprechanteil je 20-ms-Fenster (0..1). Pausen zählen nicht – so bleiben die
  // Untertitel stehen, wenn der Anrufer Luft holt, und laufen weiter, wenn er spricht.
  const FENSTER = 0.02;
  function sprechHuelle(d, sr, start, ende) {
    const n = Math.max(1, Math.ceil((ende - start) / FENSTER)), w = Math.floor(sr * FENSTER);
    const rms = new Float32Array(n); let max = 0;
    for (let i = 0; i < n; i++) {
      const a = Math.floor((start + i * FENSTER) * sr); let q = 0, k = 0;
      for (let j = a; j < a + w && j < d.length; j++) { q += d[j] * d[j]; k++; }
      rms[i] = k ? Math.sqrt(q / k) : 0; if (rms[i] > max) max = rms[i];
    }
    const schwelle = Math.max(0.008, max * 0.14), kum = new Float32Array(n);
    let summe = 0;
    for (let i = 0; i < n; i++) { if (rms[i] > schwelle) summe++; kum[i] = summe; }
    for (let i = 0; i < n; i++) kum[i] = summe ? kum[i] / summe : (i + 1) / n;
    return kum;
  }
  const stimmeLaden = id => laden(PFAD.stem(id));
  const sfxLaden = n => laden(PFAD.sfx(n));
  const musikLaden = n => laden(PFAD.musik(n));

  /* ---------- Leitung ---------- */
  function leitung(art, ziel) {
    const L = LEITUNG[art] || LEITUNG.erzaehler;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = L.hp; hp.Q.value = 0.7;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = L.lp; lp.Q.value = 0.7;
    const g = ctx.createGain(); g.gain.value = L.gain;
    hp.connect(lp);
    let letzter = lp;
    if (L.drive > 0) {
      const ws = ctx.createWaveShaper(); const n = 1024, kurve = new Float32Array(n), k = L.drive * 20;
      for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; kurve[i] = (1 + k) * x / (1 + k * Math.abs(x)); }
      ws.curve = kurve; lp.connect(ws); letzter = ws;
      g.gain.value = L.gain / (1 + L.drive * 1.6);
    }
    letzter.connect(g); g.connect(ziel);
    return hp;
  }

  /* ---------- Stimmen ---------- */
  // Spielt eine Zeile; resolves mit {dauer} sobald sie gestartet ist. onEnde wird beim (gekürzten) Ende gerufen.
  async function stimme(id, art, onEnde) {
    stimmeStop();
    init();
    const p = await stimmeLaden(id);
    const token = {};
    aktiveStimme = token;
    if (!p) { // ohne Datei: Lesezeit simulieren
      const dauer = 4;
      token.t0 = performance.now(); token.dauer = dauer;
      token.timer = setTimeout(() => { if (aktiveStimme === token) { aktiveStimme = null; onEnde && onEnde(); } }, dauer * 1000);
      token.stop = () => clearTimeout(token.timer);
      return token;
    }
    const src = ctx.createBufferSource(); src.buffer = p.buf;
    src.connect(leitung(art, stimmBus));
    const dauer = p.ende - p.start;
    const t = ctx.currentTime + 0.05;
    src.start(t, p.start, dauer + 0.05);
    token.src = src; token.dauer = dauer; token.ctxStart = t; token.huelle = p.huelle;
    token.stop = () => { try { src.stop(); } catch (e) { } };
    src.onended = () => { if (aktiveStimme === token) { aktiveStimme = null; onEnde && onEnde(); } };
    if (art === 'erzaehler') duck(true);
    return token;
  }
  function stimmeStop() {
    if (aktiveStimme) { const t = aktiveStimme; aktiveStimme = null; t.stop && t.stop(); }
    duck(false);
  }
  // Fortschritt 0..1 der laufenden Zeile (für die Untertitel)
  function fortschritt() {
    const t = aktiveStimme; if (!t) return null;
    if (t.ctxStart != null) return Math.max(0, Math.min(1, (ctx.currentTime - t.ctxStart) / t.dauer));
    return Math.min(1, (performance.now() - t.t0) / (t.dauer * 1000));
  }
  // Fortschritt nach gesprochener Zeit (für die Untertitel); ohne Hüllkurve wie fortschritt()
  function textFortschritt() {
    const t = aktiveStimme; if (!t) return null;
    if (!t.huelle || t.ctxStart == null) return fortschritt();
    const i = Math.floor((ctx.currentTime - t.ctxStart) / FENSTER);
    if (i < 0) return 0;
    return t.huelle[Math.min(i, t.huelle.length - 1)];
  }
  function pegel() {
    if (!analyser) return 0;
    analyser.getFloatTimeDomainData(pegelDaten);
    let s = 0; for (let i = 0; i < pegelDaten.length; i++) s += pegelDaten[i] * pegelDaten[i];
    return Math.min(1, Math.sqrt(s / pegelDaten.length) * 4.5);
  }

  /* ---------- Musik ---------- */
  async function musik(name, vol, fade) {
    init(); if (!ctx) return;
    fade = fade == null ? 1.2 : fade;
    if (name === musikName && musikGain) { musikVol(vol, fade); return; }
    musikAus(fade);
    musikName = name;
    if (!name) return;
    const p = await musikLaden(name);
    if (!p || musikName !== name) return;
    const g = ctx.createGain(); g.gain.value = 0; g.connect(musikBus);
    const src = ctx.createBufferSource(); src.buffer = p.buf; src.loop = true; src.connect(g);
    src.start();
    musikQuelle = src; musikGain = g; musikZiel = vol;
    g.gain.setTargetAtTime(vol * duckFaktor, ctx.currentTime, fade / 3);
  }
  function musikVol(vol, fade) {
    musikZiel = vol;
    if (musikGain) musikGain.gain.setTargetAtTime(vol * duckFaktor, ctx.currentTime, (fade == null ? 0.8 : fade) / 3);
  }
  function musikAus(fade, linear) {
    musikName = null;
    if (!musikGain) return;
    const g = musikGain, s = musikQuelle; musikGain = null; musikQuelle = null;
    const f = fade == null ? 0.8 : fade, jetzt = ctx.currentTime;
    g.gain.cancelScheduledValues(jetzt);
    if (linear) { g.gain.setValueAtTime(g.gain.value, jetzt); g.gain.linearRampToValueAtTime(0, jetzt + f); }
    else g.gain.setTargetAtTime(0, jetzt, Math.max(0.01, f / 4));
    setTimeout(() => { try { s.stop(); } catch (e) { } g.disconnect(); }, f * 1000 + 300);
  }
  function duck(ja) {
    duckFaktor = ja ? 0.4 : 1;
    if (musikGain) musikGain.gain.setTargetAtTime(musikZiel * duckFaktor, ctx.currentTime, 0.25);
  }

  /* ---------- Atmo & Klingeln ---------- */
  async function atmo(name, art) {
    atmoStop();
    if (!name) return;
    const p = await sfxLaden('atmo-' + name);
    if (!p) return;
    const g = ctx.createGain(); g.gain.value = 0;
    g.connect(leitung(art, musikBus));
    const src = ctx.createBufferSource(); src.buffer = p.buf; src.loop = true; src.connect(g); src.start();
    g.gain.setTargetAtTime(ATMO_VOL[name] || 0.1, ctx.currentTime, 0.3);
    atmoQuelle = src; atmoGain = g;
  }
  function atmoStop() {
    if (!atmoGain) return;
    const g = atmoGain, s = atmoQuelle; atmoGain = null; atmoQuelle = null;
    g.gain.setTargetAtTime(0, ctx.currentTime, 0.05);
    setTimeout(() => { try { s.stop(); } catch (e) { } }, 400);
  }
  async function ring(name, mitVibration) {
    init(); ringStop();
    const token = {}; ring.token = token;
    const [p, v] = await Promise.all([sfxLaden('ring-' + name), mitVibration ? sfxLaden('vibration') : null]);
    if (ring.token !== token) return;
    if (p) {
      const g = ctx.createGain(); g.gain.value = 0.55; g.connect(sfxBus);
      const src = ctx.createBufferSource(); src.buffer = p.buf; src.loop = true; src.connect(g); src.start();
      ringQuelle = src; ringGain = g;
    } else synthRing();
    if (mitVibration && v) {
      const buzz = () => {
        const s = ctx.createBufferSource(); s.buffer = v.buf; const g = ctx.createGain(); g.gain.value = 0.7;
        s.connect(g); g.connect(sfxBus); s.start();
        vibQuellen.push(s); s.onended = () => { vibQuellen = vibQuellen.filter(q => q !== s); };
      };
      buzz(); vibTimer = setInterval(buzz, 3000);
    }
  }
  function ringStop() {
    ring.token = null;
    clearInterval(vibTimer); vibTimer = null;
    vibQuellen.forEach(q => { try { q.stop(); } catch (e) { } }); vibQuellen = [];
    if (synthRing.timer) { clearInterval(synthRing.timer); synthRing.timer = null; }
    if (!ringGain) return;
    const g = ringGain, s = ringQuelle; ringGain = null; ringQuelle = null;
    g.gain.setTargetAtTime(0, ctx.currentTime, 0.03);
    setTimeout(() => { try { s.stop(); } catch (e) { } }, 250);
  }
  function synthRing() { // Ersatz, falls die Datei fehlt
    const eins = () => { ton(880, 0.12, 0.18, 'sine'); setTimeout(() => ton(1100, 0.12, 0.18, 'sine'), 160); };
    eins(); synthRing.timer = setInterval(eins, 1600);
  }

  async function einmal(name, vol) {
    init(); const p = await sfxLaden(name); if (!p) return;
    const g = ctx.createGain(); g.gain.value = vol == null ? 0.8 : vol; g.connect(sfxBus);
    const s = ctx.createBufferSource(); s.buffer = p.buf; s.connect(g); s.start();
  }

  /* ---------- Synthetische UI-Geräusche ---------- */
  function ton(freq, dauer, vol, typ, zuFreq, verz) {
    if (!ctx) return;
    const t = ctx.currentTime + (verz || 0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = typ || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (zuFreq) o.frequency.exponentialRampToValueAtTime(zuFreq, t + dauer);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
    o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + dauer + 0.05);
  }
  let rauschPuffer = null;
  function rauschen(dauer, vol, von, bis, verz, typ) {
    if (!ctx) return;
    if (!rauschPuffer) {
      rauschPuffer = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = rauschPuffer.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = ctx.currentTime + (verz || 0);
    const s = ctx.createBufferSource(); s.buffer = rauschPuffer; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = typ || 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(von, t); f.frequency.exponentialRampToValueAtTime(bis, t + dauer);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + dauer * 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
    s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dauer + 0.05);
  }

  const fx = {
    klick() { init(); ton(1800, 0.04, 0.08, 'triangle'); },
    hover() { ton(2400, 0.025, 0.025, 'sine'); },
    wahl() { init(); ton(660, 0.08, 0.12, 'triangle'); ton(990, 0.12, 0.1, 'triangle', null, 0.06); },
    verbinden() { init(); ton(1400, 0.03, 0.12, 'square'); rauschen(0.18, 0.05, 3000, 800, 0.02); },
    auflegen() { init(); for (let i = 0; i < 3; i++) ton(425, 0.22, 0.13, 'sine', null, i * 0.44); },
    whoosh() { init(); rauschen(0.5, 0.12, 400, 4000); },
    tippen() { ton(3000 + Math.random() * 800, 0.012, 0.02, 'square'); },
    stempel() {
      init(); ton(110, 0.25, 0.4, 'sine', 50); rauschen(0.16, 0.25, 1800, 300, 0, 'lowpass');
    },
    richtig() { init(); ton(523, 0.16, 0.16, 'triangle'); ton(784, 0.18, 0.16, 'triangle', null, 0.1); ton(1046, 0.34, 0.14, 'triangle', null, 0.2); },
    falsch() { init(); ton(220, 0.28, 0.16, 'sawtooth', 140); ton(165, 0.4, 0.14, 'sawtooth', 110, 0.16); },
    muenze(i) { ton(1500 + (i % 5) * 120, 0.06, 0.06, 'square'); ton(2600 + (i % 5) * 160, 0.05, 0.04, 'square', null, 0.03); },
    glitch(vol) { init(); einmal('glitch', vol == null ? 0.9 : vol); },
    bass() { init(); ton(55, 1.6, 0.35, 'sine', 40); rauschen(1.2, 0.05, 200, 60, 0, 'lowpass'); },
    enthuellung() { init(); rauschen(1.4, 0.08, 6000, 300); ton(880, 1.2, 0.05, 'sine', 220); },
    // Intro: dumpfer Schlag beim Szenenwechsel, Aufnahme-Piep, Scan-Wischer, Bestätigung
    schlag() { init(); ton(48, 0.9, 0.42, 'sine', 32); rauschen(0.35, 0.09, 900, 120, 0, 'lowpass'); },
    rec() { init(); ton(1320, 0.09, 0.07, 'sine'); },
    scan() { init(); rauschen(0.9, 0.05, 300, 5200, 0, 'bandpass'); },
    fertig() { init(); ton(1760, 0.05, 0.06, 'square'); ton(2350, 0.08, 0.05, 'square', null, 0.06); },
    // Feedback: Chips poppen auf, Details klappen auf
    pop(i) { ton(900 + (i || 0) * 90, 0.05, 0.05, 'triangle'); },
    aufdecken() { ton(520, 0.06, 0.06, 'triangle', 780); },
    // Hacker: lacht (hat gewonnen), knurrt (durchschaut), gähnt (echter Anruf, magere Beute)
    hackerHaha() { init(); [0, 0.11, 0.22].forEach((t, i) => ton(523 - i * 60, 0.09, 0.06, 'triangle', null, t)); ton(330, 0.3, 0.05, 'triangle', null, 0.36); },
    hackerGrr() { init(); ton(196, 0.32, 0.07, 'sawtooth', 98); rauschen(0.25, 0.04, 1500, 300, 0.05); },
    hackerGaehn() { init(); ton(300, 0.7, 0.07, 'sine', 150); }
  };

  window.Klang = {
    init, setAn, get an() { return an; },
    laden, stimmeLaden, sfxLaden, musikLaden,
    stimme, stimmeStop, fortschritt, textFortschritt, pegel,
    musik, musikVol, musikAus,
    atmo, atmoStop, ring, ringStop, einmal,
    fx,
    get ctx() { return ctx; }
  };
})();

</script>
<script>
/* ------------------------------------------------------------------
   Feier – Konfetti auf einer Leinwand über allem.
   konfetti(menge, farben): zwei Kanonen unten, Schnipsel werden von der Luft
   gebremst und flattern taumelnd zu Boden.
     farben 'cct'  – Level geschafft: CCT-Farben (Mint, Magenta, Violett, Weiß)
     farben 'bunt' – Quiz geschafft: kunterbunt
   ------------------------------------------------------------------ */
window.Feier = (function () {
  'use strict';
  var PALETTEN = {
    bunt: ['#17FFC0', '#FF5C93', '#FFCF4A', '#8B6EFF', '#5CC8FF', '#FFFFFF', '#FF8278'],
    cct: ['#17FFC0', '#00D8A7', '#FF2D87', '#FF5C93', '#7B5CFF', '#B9A8FF', '#FFFFFF']
  };

      if (!canvas.offsetParent) { requestAnimationFrame(rahmen); return; }
      t += reduziert ? 0.004 : 0.016;
      const p = quelle ? quelle() : 0.35 + 0.25 * Math.sin(t * 0.7);
      g.clearRect(0, 0, w, h);
      const mitte = h / 2, n = Math.floor(w / 3), naht = w / 2 + Math.sin(t * 0.9) * w * 0.03;
      g.beginPath();
      for (let i = 0; i <= n; i++) {
        const x = i / n * w; if (x > naht) break;
        const y = mitte + Math.sin(Math.PI * x / w) * h * 0.38 * p * kurve(x);
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.strokeStyle = '#35F0C0'; g.lineWidth = 2.2; g.shadowColor = 'rgba(53,240,192,.6)'; g.shadowBlur = 12; g.stroke();
      g.beginPath();
      const stufe = 9; let erst = true;
      for (let x = Math.floor(naht / stufe) * stufe; x <= w; x += stufe) {
        const xx = Math.max(x, naht);
        const y = Math.round((mitte + Math.sin(Math.PI * xx / w) * h * 0.38 * p * kurve(xx)) / 6) * 6;
        if (erst) { g.moveTo(xx, y); erst = false; } else g.lineTo(xx, y);
        g.lineTo(Math.min(w, x + stufe), y);
      }
      g.strokeStyle = '#FF2D87'; g.shadowColor = 'rgba(255,45,135,.6)'; g.stroke();
      g.shadowBlur = 0; g.fillStyle = 'rgba(246,244,255,.45)';
      for (let y = 6; y < h - 6; y += 7) if (Math.random() > 0.25) g.fillRect(naht - 0.75, y, 1.5, 3.5);
      requestAnimationFrame(rahmen);
    })();
  }

  // Werkbank 1: eine Aufnahme läuft drei Sekunden
  function aufnahme(dauer, ok) {
    const cv = $('rec-welle'), g = cv.getContext('2d'), zeit = $('rec-zeit');
    const r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1);
    cv.width = r.width * d; cv.height = r.height * d; g.setTransform(d, 0, 0, d, 0, 0);
    const W = r.width, H = r.height, balken = [];
    let pegel = 0, letzterPiep = 0;
    const t0 = performance.now();
    return new Promise(fertig => {
      (function schritt(t) {
        const f = Math.min(1, (t - t0) / dauer);
        zeit.textContent = '00:0' + (f * 3).toFixed(1);
        // sprachartige Hüllkurve: Silben mit kleinen Pausen
        const silbe = Math.sin(t / 95) * 0.5 + 0.5, pause = Math.sin(t / 610) > -0.55 ? 1 : 0.12;
        pegel += ((0.25 + Math.random() * 0.75) * silbe * pause - pegel) * 0.35;
        balken.push(pegel);
        const n = Math.floor(W / 5); while (balken.length > n) balken.shift();
        g.clearRect(0, 0, W, H);
        balken.forEach((v, i) => {
          const hh = Math.max(2, v * H * 0.9), x = W - (balken.length - i) * 5;
          g.fillStyle = i > balken.length - 4 ? '#FF2D87' : 'rgba(255,45,135,.55)';
          g.fillRect(x, (H - hh) / 2, 3, hh);
        });
        if (t - letzterPiep > 1000) { K.fx.rec(); letzterPiep = t; }
        if (f < 1 && ok()) requestAnimationFrame(schritt); else fertig();
      })(t0);
    });
  }

  // Die Liste liegt unter allem anderen und nimmt keine Klicks an; neue Zeilen kommen ruhig, nicht im Takt der Bildwiederholung.
  // Beim falschen Helpdesk (c3) ist das Postfach anfangs leer und läuft dann langsam voll, bis kein Platz mehr ist.

  function posteingang(a) {

    const el = $('win-mails'), neuEl = $('win-mails-neu'), liste = $('win-mail-liste'), lesen = $('win-lesen');

      const name = von.includes('@') ? von.split('@')[1] : von;

      return `<i class="m-av" style="--c:${MAIL_FARBEN[[...name].reduce((s, c) => s + c.charCodeAt(0), 0) % MAIL_FARBEN.length]}">${esc(kuerzel)}</i>`;

  /* ---------- Transkript: im Gespräch rechts über den Antworten, bei „Details anzeigen“ links beim Gerät ----------
     Das Telefon rückt nach links (Teams nach oben) und macht Platz; die Hinweise markieren ihre Stelle im Gespräch. */
  function transkriptLinks(links) {
    const cc = $('cc'), spalte = geraet.parentElement;
    if (links === spalte.classList.contains('mit-transkript')) return;
    const dev = geraet.querySelector(geraet.dataset.art === 'teams' ? '.win' : '.phone'), vorher = dev.getBoundingClientRect();
    if (links) geraet.after(cc); else $('dialog').prepend(cc);
    spalte.classList.toggle('mit-transkript', links);
    if (!links || reduziert) return;
    // Gerät gleitet an seinen neuen Platz, das Transkript schiebt sich daneben
    const nachher = dev.getBoundingClientRect();
    if (vorher.width && nachher.width) dev.animate([
      { transform: `translate(${vorher.left - nachher.left}px, ${vorher.top - nachher.top}px) scale(${vorher.width / nachher.width})`, transformOrigin: 'top left' },
      { transform: 'none', transformOrigin: 'top left' }], { duration: 550, easing: 'cubic-bezier(.2, .8, .2, 1)' });
    cc.animate([{ opacity: 0, transform: 'translateX(40px)' }, { opacity: 1, transform: 'none' }], { duration: 450, delay: 150, easing: 'ease-out', fill: 'backwards' });
  }

  // Feedback: der ganze Gesprächsverlauf, die Stellen zu den Hinweisen markiert (wie das Spotlight in der Phishing Challenge)
  function transkriptZeigen(liste) {
    const log = $('cc-log');
    log.innerHTML = S.lauf.verlauf.map(z => {

  /* ---------- Untertitel ---------- */
  let ccZeile = null, ccWoerter = [], ccRaf = null, ccQuelle = null;
  function ccNeu(wer, text, art) {
    const log = $('cc-log');
    if (S.lauf) S.lauf.verlauf.push({ wer, text, art });
    const d = document.createElement('div');
    d.className = 'cc-zeile cc-' + art;

  function ccStart(el, quelle) {

    // Startpunkt jedes Wortes als Anteil an allen Buchstaben (Satzzeichen zählen als kurze Pause)
    const gewicht = ccWoerter.map(w => w.textContent.replace(/[^\p{L}\p{N}]/gu, '').length + (/[.!?…]$/.test(w.textContent) ? 3 : /[,–:]$/.test(w.textContent) ? 1.5 : 0) + 1);
    const gesamt = gewicht.reduce((a, b) => a + b, 0);
    let lauf = 0; const ab = gewicht.map(g => { const v = lauf / gesamt; lauf += g; return v; });
    cancelAnimationFrame(ccRaf);
    const log = $('cc-log');
    (function schritt() {
      const f = ccQuelle ? ccQuelle() : null;
      if (f != null) {
        for (let i = 0; i < ccWoerter.length; i++) if (ab[i] <= f + 0.015 && !ccWoerter[i].classList.contains('an')) { ccWoerter[i].classList.add('an'); log.scrollTop = log.scrollHeight; }

  /* ---------- Sprechen ---------- */

  /* ---------- Ring-Visual ---------- */
  function ringZeichnen() {
    const z = geraet.dataset.zustand;
    const cv = S.a.geraet === 'teams' ? $('win-ring') : $('ph-ring');
    const g = cv.getContext('2d'), w = cv.width, h = cv.height, m = w / 2;
    g.clearRect(0, 0, w, h);
    const t = performance.now() / 1000;
    if (z === 'ring') {
      for (let k = 0; k < 3; k++) {
        const f = ((t * 0.7 + k / 3) % 1);
        g.beginPath(); g.arc(m, m, 62 + f * 90, 0, Math.PI * 2);
        g.strokeStyle = S.a.geraet === 'teams' ? `rgba(127,133,245,${0.5 * (1 - f)})` : `rgba(53,240,192,${0.5 * (1 - f)})`; g.lineWidth = 2.5; g.stroke();
      }
    } else if (z === 'talk') {
      const p = K.pegel();
      g.beginPath();
      for (let i = 0; i <= 72; i++) {
        const wnk = i / 72 * Math.PI * 2;
        const r = 70 + p * 26 * (0.7 + 0.3 * Math.sin(wnk * 3 + t * 4)) + p * 7 * Math.sin(wnk * 5 - t * 6);
        const x = m + Math.cos(wnk) * r, y = m + Math.sin(wnk) * r;
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.closePath();
      const rgb = S.a.geraet === 'teams' ? '127,133,245' : '53,240,192';   // Teams-Violett bzw. Aqua
      g.strokeStyle = `rgba(${rgb},.9)`; g.lineWidth = 2.5; g.stroke();
      g.fillStyle = `rgba(${rgb},${0.06 + p * 0.18})`; g.fill();
    }
    if (z === 'ring' || z === 'talk') ringId = requestAnimationFrame(ringZeichnen);
  }

  /* ================= Feedback im Panel (wie in der Phishing Challenge) =================
     Schritt 1: Ergebnis, allgemeine Rückmeldung, das Entscheidende – der Hacker fliegt kurz herein.
     Schritt 2 („Details anzeigen“): die Signale einzeln, zum Schluss „Das schützt dich“. */
  const H_ICON = {

    schutz: '<svg class="ico" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6L12 3Z"/><path d="m8.6 12 2.4 2.4 4.4-4.9"/></svg>'

  function feedbackZeigen(erg, kasseVorher) {
    const a = S.a, F = C.feedback, ep = S.epoche;

  // Schritt 2: die Hinweise der Reihe nach
  function details() {

  function hinweis(i, erster) {

    setTimeout(() => {

      const b = box.getBoundingClientRect(), r = karte.getBoundingClientRect(), fuss = $('feedback').querySelector('.fb-aktionen').offsetHeight;
      const oben = r.top - b.top - 12, unten = r.bottom - (b.bottom - fuss - 8);
      const um = oben < 0 ? oben : Math.min(Math.max(0, unten), oben);
      if (Math.abs(um) > 1) box.scrollTo({ top: box.scrollTop + um, behavior: reduziert ? 'auto' : 'smooth' });
    }, reduziert ? 0 : 450);

  function weiterNachFeedback() {

  /* ================= Level-Auswertung: Halbkreis-Messer wie in der Serie ================= */
  function levelEnde(l) {
    ++S.epoche;
    S.level = l;
    const lv = LV[l], LE = C.levelEnde, a0 = lvStart(l), n = lv.anzahl;
    S.i = a0 + n - 1;
    $('hud-beute-wert').textContent = euro(S.beute);
    const anrufe = C.anrufe.slice(a0, a0 + n), erg = anrufe.map((a, k) => S.ergebnisse[a0 + k]);
    const r = richtigIm(l), beute = erg.reduce((x, e) => x + ((e && e.beute) || 0), 0);
    const perfekt = r === n, gut = bestanden(l), letztes = l === LV.length - 1;
    const titel = perfekt ? LE.perfekt : gut ? f(LE.gut, { n: l + 1 }) : LE.nichtBestanden;
    // nicht bestanden: dasselbe Level noch einmal
    const weiterText = !gut ? f(LE.wiederholen, { n: l + 1 }) : letztes ? LE.zumSchluss : (l === 0 && !S.pauseFertig ? LE.zumTipp : f(LE.naechstesLevel, { n: l + 2 }));
    const mitte = `<span class="m-symbol ${gut ? '' : 'nein'}"><svg viewBox="0 0 24 24"><path d="${gut ? 'm5 12.5 4.5 4.5L19 7.5' : 'M6.5 6.5l11 11M17.5 6.5l-11 11'}"/></svg></span>
      <span class="m-prozent">0 %</span><span class="m-richtig">${esc(f(LE.richtig, { richtig: r, gesamt: n }))}</span>`;
    $('le-karte').innerHTML = `
      <span class="pille-kicker ohne">${esc(f(LE.kicker, { n: l + 1, gesamt: LV.length }))}</span>${punkte(l)}
      <h1>${esc(titel)}</h1>
      ${gut ? '' : `<p class="le-hinweis">${esc(f(LE.nichtBestandenText, { mindestens: mindestens(l), gesamt: n }))}</p>`}
      ${messer(n ? r / n : 0, mitte, mindestens(l) / n, LE.ziel)}
      <div class="le-kacheln">${erg.map((e, k) => `<span class="le-kachel ${istRichtig(e) ? 'ja' : 'nein'}" style="--i:${k}" title="${esc(anrufe[k].storyTitel)}">${istRichtig(e) ? HAKEN : KREUZ}</span>`).join('')}</div>
      <div class="le-beute ${beute ? '' : 'null'}"><img src="assets/hacker-face.png" alt=""><span><small>${esc(LE.beute)}</small><b>${beute ? euro(beute) : esc(LE.beuteNull)}</b></span></div>
      <details class="le-details"><summary><svg class="ico" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>${esc(LE.details)}</summary>
        <ol class="le-liste">${anrufe.map((a, k) => `<li class="${istRichtig(erg[k]) ? 'ja' : 'nein'}">${istRichtig(erg[k]) ? HAKEN : KREUZ}<span class="le-titel">${esc(a.storyTitel)}</span>
          <span class="tag ${a.echt ? 'tag-echt' : 'tag-fake'}">${esc(a.echt ? LE.warEcht : LE.warFake)}</span></li>`).join('')}</ol></details>
      <div class="le-fuss allein"><button class="btn btn-gross btn-mint" id="le-weiter" type="button">${gut ? esc(weiterText) + ' ' + PFEIL : NOCHMAL + esc(weiterText)}</button></div>`;
    zeige('s-levelende');
    K.musik('intro', 0.3, 1.5);
    messerStarten($('le-karte'));
    setTimeout(() => (gut ? K.fx.richtig : K.fx.falsch)(), reduziert ? 0 : 300);
    if (gut && !beute) setTimeout(() => konfetti(perfekt ? 120 : 80, 'cct'), reduziert ? 0 : 1500);
    if (gut && !testModus) { LMS.fortschritt((l + 1) / LV.length); merken(); }
    $('le-weiter').addEventListener('click', () => {
      K.fx.klick();
      if (!gut) levelWiederholen(l);
      else if (letztes) nuggetZeigen('schluss');
      else if (l === 0 && !S.pauseFertig) nuggetZeigen('pause');
      else levelIntro(l + 1);
    });
    setTimeout(() => { const b = $('le-weiter'); if (b) b.focus({ preventScroll: true }); }, 900);
  }

  // Nicht bestanden: die Ergebnisse des Levels verfallen, auch die Beute daraus – dann dieselben Anrufe noch einmal (ohne Intro)
  function levelWiederholen(l) {
    for (let i = lvStart(l); i < lvStart(l) + LV[l].anzahl; i++) {
      if (S.ergebnisse[i]) S.beute -= S.ergebnisse[i].beute || 0;
      delete S.ergebnisse[i];
    }
    $('hud-beute-wert').textContent = euro(S.beute);
    levelIntro(l, true);
  }

  /* ================= Nugget: nach Level 1 der Sicherheitstipp (drei Lehren),
     nach dem letzten Level „Zum Schluss“ (ein Tipp, dann die Frage und die Rückruf-Regel) ================= */
  function nuggetZeigen(teil) {
    ++S.epoche;
    zeige('s-pause');
    K.musik('intro', 0.3, 2);
    const T = C[teil];
    S.nugget = teil;
    $('pause-kicker').textContent = T.kicker; $('pause-titel').textContent = T.titel;
    $('nugget-zurueck').textContent = C.pause.zurueck;
    $('nugget').hidden = false; $('pause-quiz').hidden = true;
    S.pause = null; S.karteMax = 0;
    $('nugget-punkte').innerHTML = T.karten.length < 2 ? '' : T.karten.map((k, i) => `<button type="button" data-i="${i}" aria-label="${esc(f(C.pause.lehre, { n: i + 1, gesamt: T.karten.length }))}"></button>`).join('');
    $('nugget-punkte').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { K.fx.klick(); karteZeigen(+b.dataset.i); }));
    karteZeigen(0);
  }
  function karteZeigen(i) {
    const P = C.pause, T = C[S.nugget], k = T.karten[i], n = T.karten.length, el = $('nugget-karte');
    S.karte = i; S.karteMax = Math.max(S.karteMax, i);
    el.style.setProperty('--farbe', k.farbe);
    el.innerHTML = `<div class="nk-text">
        ${k.einleitung ? `<p class="nk-einleitung">${esc(k.einleitung)}</p>` : ''}
        ${n > 1 ? `<p class="nk-nr">${esc(f(P.lehre, { n: i + 1, gesamt: n }))}</p>` : ''}
        <h3>${esc(k.titel)}</h3><p class="nk-inhalt">${esc(k.text)}</p>
        ${k.liste ? `<ul class="nk-liste">${k.liste.map((x, j) => `<li style="--i:${j}"><b>${esc(x.titel)}</b><span>${esc(x.beispiel)}</span></li>`).join('')}</ul>` : ''}
        ${k.beispiel ? `<p class="nk-beispiel">${chipHoerer}<span><b>${esc(P.beispiel)}:</b> ${esc(k.beispiel)}</span></p>` : ''}
      </div>
      <div class="nk-bild"><img src="${k.bild}" alt=""></div>`;
    el.classList.remove('rein'); void el.offsetWidth; el.classList.add('rein');
    // Punkte: bereits gesehene Lehren lassen sich wieder aufrufen, spätere noch nicht
    $('nugget-punkte').querySelectorAll('button').forEach((b, j) => { b.className = j === i ? 'an' : j <= S.karteMax ? 'fertig' : ''; b.disabled = j > S.karteMax; });
    $('nugget-zurueck').hidden = i === 0;
    const letzte = i === n - 1;
    $('nugget-weiter').innerHTML = esc(!letzte ? P.weiter : S.nugget === 'schluss' ? T.zurFrage : f(C.levelEnde.naechstesLevel, { n: 2 })) + ' ' + PFEIL;
    $('s-pause').scrollTop = 0;
    ueberlauf($('s-pause'));
    K.fx.pop(i);
  }
  // Ragt der Inhalt über den Bildschirm, bekommen die klebenden Knöpfe unten einen Verlauf (Nugget, Frage, Auswertung)
  function ueberlauf(sc) {
    sc.classList.toggle('ueberlauf', sc.scrollHeight > sc.clientHeight + 2);
  }
  addEventListener('resize', () => { if (['s-pause', 's-ende'].includes(app.dataset.screen)) ueberlauf($(app.dataset.screen)); });
  function karteWeiter() {
    K.fx.klick();
    if (S.karte < C[S.nugget].karten.length - 1) karteZeigen(S.karte + 1);
    else if (S.nugget === 'schluss') frageZeigen();
    else { S.pauseFertig = true; merken(); levelIntro(1); }
  }
  $('nugget-weiter').addEventListener('click', karteWeiter);
  $('nugget-zurueck').addEventListener('click', () => { if (S.karte > 0) { K.fx.klick(); karteZeigen(S.karte - 1); } });

  function frageZeigen() {
    const P = C.schluss, sc = $('s-pause'), inner = sc.querySelector('.pause-inner');
    $('nugget').hidden = true; $('pause-quiz').hidden = false;
    $('pause-titel').textContent = P.frageTitel;
    sc.scrollTop = 0;
    inner.classList.remove('rein'); void inner.offsetWidth; inner.classList.add('rein');
    $('pause-szene').textContent = P.szene; $('pause-frage').textContent = P.frage;
    $('pause-antwort').hidden = true; $('pause-fuss').hidden = true;
    S.pause = null;
    $('pause-optionen').innerHTML = P.optionen.map((o, i) =>
      `<button class="option pause-option" type="button" data-i="${i}" style="--i:${i};--farbe:${o.farbe || 'var(--lilac)'}"><span class="p-icon">${icon(o.icon)}</span><span class="p-text">${esc(o.text)}</span><kbd>${String.fromCharCode(65 + i)}</kbd></button>`).join('');
    $('pause-optionen').querySelectorAll('button').forEach(b => b.addEventListener('click', () => pauseWaehlen(+b.dataset.i)));
  }
  function pauseWaehlen(i) {
    if (S.pause != null) return;
    const P = C.schluss, o = P.optionen[i];
    S.pause = o.wert;
    $('pause-optionen').querySelectorAll('button').forEach((b, k) => {
      b.disabled = true;
      b.classList.add(k === i ? 'gewaehlt' : 'nicht');
      if (P.optionen[k].wert === 'voll') b.classList.add('loesung');
      b.dataset.wert = P.optionen[k].wert;
    });
    (o.wert === 'voll' ? K.fx.richtig : o.wert === 'halb' ? K.fx.wahl : K.fx.falsch)();
    // eine Rückmeldung: Antwort und Erklärung, darunter in derselben Box die Rückruf-Regel
    const an = $('pause-antwort'); an.dataset.wert = o.wert;
    $('pause-antwort-titel').textContent = o.titel; $('pause-antwort-text').textContent = o.erklaerung;
    $('pause-regel-titel').textContent = P.regel.titel;
    $('pause-regel-punkte').innerHTML = P.regel.punkte.map((r, k) => `<li style="--i:${k}">${icon(r.icon)}<div><b>${esc(r.titel)}</b><span>${esc(r.text)}</span></div></li>`).join('');
    an.hidden = false;
    // der Knopf klebt unten; liegt die Rückmeldung tief, rückt sie ins Bild
    setTimeout(() => {
      $('pause-fuss').hidden = false; $('pause-weiter').innerHTML = esc(C.levelEnde.zumErgebnis) + ' ' + PFEIL;
      const sc = $('s-pause'), oben = an.getBoundingClientRect().top - sc.getBoundingClientRect().top;
      ueberlauf(sc);
      if (oben > sc.clientHeight * .45) sc.scrollTo({ top: sc.scrollTop + oben - 90, behavior: reduziert ? 'auto' : 'smooth' });
    }, 350);
  }
  $('pause-weiter').addEventListener('click', () => { K.fx.klick(); ende(); });

  /* ================= Auswertung (wie das Ergebnis der Serie) ================= */
  function ende() {
    ++S.epoche;
    const A = C.auswertung, N = C.anrufe.length;
    const erg = S.ergebnisse;
    const richtig = C.anrufe.filter((a, i) => istRichtig(erg[i])).length;
    const gut = erg.filter(Boolean).reduce((x, e) => x + (e.gut || 0), 0);
    const rang = A.raenge.find(r => N - richtig <= r.fehler);
    const hackerText = richtig >= N - 1 && !S.beute ? A.hackerGut : (richtig >= N - 2 ? A.hackerMittel : A.hackerSchlecht);
    const mitte = `<span class="m-prozent">0 %</span><span class="m-richtig">${richtig}/${N} ${esc(A.richtig)}</span>`;
    const akte = C.anrufe.map((a, i) => {
      const e = erg[i] || {};
      const st = !a.echt ? (e.zuSpaet ? 'zuSpaet' : e.richtig ? 'entlarvt' : 'getaeuscht') : (e.richtig ? 'echtErkannt' : 'fehlalarm');
      return `<li class="akte-${st}" style="--i:${i}"><span class="akte-nr">${i + 1}</span><div><b>${esc(a.storyTitel)}</b><span>${C.hud.level} ${levelVon(i) + 1} · ${esc(a.echt ? C.levelEnde.warEcht : C.levelEnde.warFake)} · ${esc(a.anrufer.name)}</span></div><em>${C.feedback[st].stempel}</em></li>`;
    }).join('');
    $('finale').innerHTML = `
      <div class="f-kopf">
        ${messer(richtig / N, mitte)}
        <div class="f-kopf-text">
          <span class="pille-kicker">${esc(A.titel)}</span>
          <h1 class="titel-gross">${esc(rang.titel)}</h1>
          <p class="lead">${esc(rang.text)}</p>
          <div class="f-zahlen">
            <div class="f-beute ${S.beute ? '' : 'null'}"><img src="assets/hacker-face.png" alt=""><span><b id="ende-beute">0 €</b><small>${esc(S.beute ? A.beuteVoll : A.beuteNull)}</small></span></div>
            <div class="f-nachgehakt"><b>${gut}×</b><small>${esc(A.nachgehakt)}</small></div>
          </div>
        </div>
      </div>
      <div class="hacker-sagt" id="ende-hacker" data-stimmung="${S.beute ? 'froh' : 'sauer'}"><img src="assets/hacker.png" alt=""><p id="ende-hacker-text"></p></div>
      <div class="f-raster">
        <section class="f-block karte"><h2>${esc(A.akte)}</h2><ol class="akte">${akte}</ol></section>
        <section class="f-block karte"><h2>${esc(A.regelnTitel)}</h2><ol class="regeln">${A.regeln.map((r, i) => `<li style="--i:${i}"><b>${esc(r.titel)}</b><span>${esc(r.text)}</span></li>`).join('')}</ol></section>
      </div>
      <p class="quellen">${esc(A.quellen)}</p>
      <p class="quellen">${esc(A.kleingedruckt)}</p>
      <div class="f-fuss">
        ${S.lmsGemeldet ? `<p class="f-lms">${HAKEN}${esc(A.lms)}</p>` : ''}
        <button class="btn btn-gross btn-mint" id="ende-nochmal" type="button">${NOCHMAL}${esc(A.nochmal)}</button>
      </div>`;
    zeige('s-ende');
    K.musik('auswertung', 0.45, 2);
    messerStarten($('finale'));
    zaehle($('ende-beute'), S.beute, euro, 1600);
    setTimeout(() => tippe($('ende-hacker-text'), hackerText, 26, true), reduziert ? 0 : 900);
    if (!reduziert) C.anrufe.forEach((a, i) => setTimeout(() => K.fx.pop(i), 700 + i * 160));
    setTimeout(() => (richtig >= N - 2 ? K.fx.richtig : K.fx.stempel)(), reduziert ? 0 : 500);
    if (!S.beute) setTimeout(() => konfetti(140, 'bunt'), reduziert ? 0 : 1300);
    $('ende-nochmal').addEventListener('click', () => { K.fx.klick(); neuesSpiel(); levelIntro(0); });
    ueberlauf($('s-ende'));
  }

  /* ================= LMS: Stand merken, abschließen ================= */
  // Gemerkt wird nach jedem bestandenen Level und nach dem Sicherheitstipp: bestandene Levels, ihre Ergebnisse und die Beute.
  // Beim nächsten Öffnen geht es dort weiter (siehe Start unten).
  function merken() {
    if (testModus || !LMS.aktiv()) return;
    let l = 0; while (l < LV.length && bestanden(l)) l++;
    const e = S.ergebnisse.slice(0, lvStart(l)).map(x => [x.id, x.wahl === 'echt' ? 1 : 0, x.richtig ? 1 : 0, x.zuSpaet ? 1 : 0, x.beute || 0, x.gut || 0]);
    LMS.speichern({ v: 1, l, p: S.pauseFertig ? 1 : 0, b: S.beute, e }, 'level' + Math.min(l + 1, LV.length));
    // Alle Levels bestanden: abgeschlossen und bestanden, Punkte = Anteil der richtig erkannten Anrufe (letzter Versuch je Level)
    if (l === LV.length && !S.lmsGemeldet) {
      const richtig = C.anrufe.filter((a, i) => istRichtig(S.ergebnisse[i])).length;
      S.lmsGemeldet = LMS.abschliessen(100 * richtig / C.anrufe.length, true);
    }
  }
  function standLaden(d) {
    if (!d || d.v !== 1 || !(d.l > 0) || d.l >= LV.length) return false;
    S.ergebnisse = []; S.beute = d.b || 0; S.pauseFertig = !!d.p;
    (d.e || []).forEach((x, i) => { S.ergebnisse[i] = { id: x[0], wahl: x[1] ? 'echt' : 'fake', richtig: !!x[2], zuSpaet: !!x[3], beute: x[4], gut: x[5], zuege: [], pfad: [] }; });
    return d.l;
  }

  /* ================= Lage-Umschalter (schmal) ================= */
  $('lage-toggle').addEventListener('click', () => {
    const l = $('lage'); l.classList.toggle('zu');
    $('lage-toggle').setAttribute('aria-expanded', !l.classList.contains('zu'));
  });

  /* ================= Tastatur ================= */
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const scr = app.dataset.screen;
    if (scr === 's-spiel') {
      if (!$('urteil').hidden) {
        if (e.key === 'ArrowLeft') urteilen('echt');
        if (e.key === 'ArrowRight') urteilen('fake');
        return;
      }
      if (!$('feedback').hidden) return;
      const z = geraet.dataset.zustand;
      if (z === 'ring' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); annehmen(); }
      if (z === 'talk' && !$('wahl').hidden && (e.key === '1' || e.key === '2')) waehlen(+e.key - 1);
    }
    if (scr === 's-level' && e.key === 'Enter' && document.activeElement !== $('lv-los')) { e.preventDefault(); $('lv-los').click(); }
    if (scr === 's-pause' && !$('nugget').hidden) {
      if (e.key === 'ArrowRight') karteWeiter();
      if (e.key === 'ArrowLeft') $('nugget-zurueck').click();
    } else if (scr === 's-pause' && S.pause == null) {
      const k = 'abcd'.indexOf(e.key.toLowerCase()); if (k >= 0) pauseWaehlen(k);
    }
  });

  /* ================= Start ================= */
  startAufbauen();
  untertitelSetzen(S.cc);
  zeige('s-start');

  // Im LMS: Verbindung aufnehmen; wer schon ein Level bestanden hat, macht beim nächsten Level weiter
  LMS.init();
  addEventListener('pagehide', () => LMS.beenden());
  addEventListener('beforeunload', () => LMS.beenden());
  const weiterAb = standLaden(LMS.laden());
  if (weiterAb) {
    $('start-los').innerHTML = esc(f(C.auswertung.weiterSpielen, { n: weiterAb + 1 })) + ' ' + PFEIL;
    $('start-los').addEventListener('click', ev => {
      ev.stopImmediatePropagation();
      K.init(); K.fx.klick();
      const stand = { e: S.ergebnisse, b: S.beute, p: S.pauseFertig };
      neuesSpiel();
      S.ergebnisse = stand.e; S.beute = stand.b; S.pauseFertig = stand.p; S.introGesehen = true;
      $('hud-beute-wert').textContent = euro(S.beute);
      if (weiterAb === 1 && !S.pauseFertig) nuggetZeigen('pause'); else levelIntro(weiterAb);
    }, { capture: true, once: true });
  }

  // Testsprünge: #intro, #l1, #l2, #anruf1 … #anruf6, #e1, #e2, #pause, #schluss, #frage, #ende (fremde Hashes, z. B. vom LMS, zählen nicht)
  const sprung = location.hash.slice(1);
  if (/^(intro|l\d|anruf\d|e\d|pause|schluss|frage|ende)$/.test(sprung)) {
    testModus = true;
    const testErgebnisse = () => C.anrufe.forEach((a, i) => {
      const richtig = i !== 1;
      S.ergebnisse[i] = { richtig, zuSpaet: false, gut: i % 2 ? 1 : 2, beute: !a.echt && !richtig ? a.beute : 0, zuege: [], pfad: [] };
    });
    const los = () => {
      K.init();
      neuesSpiel();
      const m = /^anruf([1-9])$/.exec(sprung), l = /^l([1-9])$/.exec(sprung), e = /^e([1-9])$/.exec(sprung);
      if (m) {
        const n = Math.min(+m[1] - 1, C.anrufe.length - 1);
        S.pauseFertig = levelVon(n) > 0;
        hudAufbauen(); anrufStarten(n);
      } else if (l) { S.pauseFertig = +l[1] > 1; levelIntro(Math.min(+l[1] - 1, LV.length - 1)); }
      else if (e) { testErgebnisse(); S.beute = S.ergebnisse.reduce((x, r) => x + r.beute, 0); levelEnde(Math.min(+e[1] - 1, LV.length - 1)); }
      else if (sprung === 'intro') intro();
      else if (sprung === 'pause') nuggetZeigen('pause');
      else if (sprung === 'schluss') nuggetZeigen('schluss');
      else if (sprung === 'frage') { nuggetZeigen('schluss'); frageZeigen(); }
      else if (sprung === 'ende') { testErgebnisse(); S.beute = S.ergebnisse.reduce((x, r) => x + r.beute, 0); ende(); }
    };
    $('start-los').innerHTML = 'Test: ' + esc(sprung);
    $('start-los').addEventListener('click', ev => { ev.stopImmediatePropagation(); los(); }, { capture: true });
  }
})();

</script>
</body>
</html>
