<style>
/* ------------------------------------------------------------
   Mensch oder KI? 2.0 — im Look der Phishing Challenge 2.0 (CCT-Serie)
   Dunkles Indigo mit zwei schwachen Lichtern, Pillen-Knöpfe, Karten in #27264E,
   Mint = echt / weiter, Koralle = Fake, Magenta = Hacker-Beute, Gold = Hinweis.
   Bewusst ohne Webfonts (Systemschrift) – sieht in jedem LMS gleich aus.
   Spiel: links das Gerät (Handy bzw. Teams), rechts oben die Lage, darunter
   Live-Untertitel, Antworten und das Urteil.
   ------------------------------------------------------------ */
:root {
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
  --display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: var(--font);   /* Etiketten wie in der Serie in der Grundschrift */
  --code: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, Menlo, monospace;

  --nacht: #0B0633;
  --night: #0B0633;
  --ink: #120A45;
  --karte: rgba(39, 38, 78, .9);
  --karte-fest: #27264E;
  --glas: rgba(39, 38, 78, .9);
  --glas-fest: #27264E;
  --kante: rgba(255, 255, 255, .08);
  --kante-2: rgba(255, 255, 255, .15);
  --line: rgba(255, 255, 255, .15);
  --licht: inset 0 0 0 1px rgba(255, 255, 255, .08);
  --schatten: 0 40px 80px -40px rgba(0, 0, 0, .9);
  --text: #FFFFFF;
  --text-2: #D9D7EC;
  --text-3: #9C98C4;
  --lilac: #C3BFE0;
  --dim: #9C98C4;

  --mint: #17FFC0;
  --aqua: #17FFC0;
  --aqua-ink: #00261C;
  --koralle: #FF8278;
  --pink: #FF2D87;
  --gold: #FFCF4A;
  --violet: #7B5CFF;
  --rot: #FF3B4E;
  --gruen: #22C55E;

  --radius: 22px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --sprung: cubic-bezier(.34, 1.56, .64, 1);
  --hud-h: 68px;
  --panel-b: clamp(340px, 30vw, 460px);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; font-size: clamp(15px, .28vw + 11.2px, 18px); overscroll-behavior: none; }
body { height: 100%; margin: 0; background: var(--nacht); color: var(--text); font-family: var(--font); line-height: 1.5;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
[hidden] { display: none !important; }
p { margin: 0; }
h1, h2, h3 { margin: 0; font-family: var(--display); line-height: 1.15; }
img { display: block; max-width: 100%; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; border-radius: 10px; }
kbd { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 7px;
  font: 700 11px/1 var(--code); color: var(--text-3); background: rgba(0, 0, 0, .14); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14); }
.ico { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico .fill { fill: currentColor; stroke: none; }

.app { position: fixed; inset: 0; display: grid; grid-template-rows: var(--hud-h) minmax(0, 1fr); overflow: hidden; isolation: isolate; }
.buehne-app { position: relative; min-height: 0; }
/* Konfetti-Leinwand (js/feier.js): liegt über allem und nimmt keinen Platz im Raster ein –
   ohne diese Regel wurde sie zur dritten Rasterzeile und ließ unten einen 150 px hohen leeren Streifen */
.feier { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 46; pointer-events: none; display: none; }
.feier.an { display: block; }

/* ================= Hintergrund wie in der Serie ================= */
.bg { position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; background: #0B0633; }
.bg > div { position: absolute; inset: 0; transition: opacity .9s var(--ease); }
.bg-quiz { background: radial-gradient(45% 45% at 38% 42%, rgba(30, 110, 150, .35), rgba(0, 0, 0, 0) 70%),
  radial-gradient(45% 45% at 66% 62%, rgba(150, 40, 130, .22), rgba(0, 0, 0, 0) 70%), #0B0633; }
.bg-tipp { opacity: 0; background: radial-gradient(60% 55% at 50% 50%, #133A62 0%, rgba(19, 58, 98, .35) 45%, rgba(8, 6, 36, 0) 78%), #080624; }
.app[data-screen="s-pause"] .bg-tipp { opacity: 1; }

/* ================= HUD wie in der Serie ================= */
.hud { position: relative; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 clamp(12px, 2vw, 28px); transition: opacity .5s; }
.app[data-screen="s-intro"] .hud { opacity: 0; pointer-events: none; }
.hud-pille { display: inline-flex; align-items: center; gap: 12px; height: 46px; padding: 0 16px 0 7px; border-radius: 999px; background: rgba(29, 29, 66, .82);
  box-shadow: inset 0 0 0 1px var(--kante), 0 10px 24px -14px rgba(0, 0, 0, .7); backdrop-filter: blur(8px); }
.hud-logo { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: linear-gradient(145deg, #FF2D87, #6D2BC5); }
#hud-titel { font-weight: 700; font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-marke { min-width: 0; }
.hud-rechts { display: flex; align-items: center; gap: 10px; }
.hud-beute { padding-right: 18px; gap: 10px; background: linear-gradient(180deg, rgba(255, 45, 135, .2), rgba(255, 45, 135, .1));
  box-shadow: inset 0 0 0 1px rgba(255, 45, 135, .45), 0 8px 22px -12px rgba(255, 45, 135, .8); animation: popEin .5s var(--sprung) both; transition: transform .3s var(--sprung), box-shadow .3s; }
.hud-beute img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; object-position: center 25%; background: #1B1450; }
.hb-text { display: flex; flex-direction: column; line-height: 1; }
.hb-text small { font-size: .58rem; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; color: #FF9CC6; }
.hb-text b { font-size: 1.05rem; font-weight: 900; color: #FFC2DC; font-variant-numeric: tabular-nums; margin-top: 3px; white-space: nowrap; }
.hud-beute.steigt { transform: scale(1.08); box-shadow: inset 0 0 0 1px rgba(255, 45, 135, .8), 0 0 30px -4px rgba(255, 45, 135, .7); }
.hud-fortschritt { padding: 0 18px; gap: 14px; font-size: .86rem; font-weight: 700; animation: popEin .5s var(--sprung) both; }
.hud-level { padding-right: 14px; box-shadow: 1px 0 0 var(--kante-2); white-space: nowrap; }
.hud-frage { display: flex; flex-direction: column; gap: 5px; white-space: nowrap; }
.hud-segmente { display: flex; gap: 4px; }
.hud-segmente i { flex: 1; min-width: 14px; height: 5px; border-radius: 99px; background: rgba(255, 255, 255, .16); transition: background .45s var(--ease), box-shadow .45s; }
.hud-segmente i.jetzt { background: rgba(255, 255, 255, .6); animation: pipPuls 1.6s ease-in-out infinite; }
.hud-segmente i.ja { background: var(--mint); box-shadow: 0 0 10px rgba(23, 255, 192, .55); }
.hud-segmente i.nein { background: var(--koralle); box-shadow: 0 0 10px rgba(255, 130, 120, .5); }
@keyframes pipPuls { 50% { opacity: .45; } }
.icon-btn { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: rgba(29, 29, 66, .82); color: var(--text-2);
  box-shadow: inset 0 0 0 1px var(--kante); transition: background .2s, color .2s, transform .2s var(--sprung); }
.icon-btn:hover { background: rgba(255, 255, 255, .1); color: #fff; transform: scale(1.06); }
.icon-btn .ico { width: 22px; height: 22px; }
.icon-btn .ton-aus { display: none; }
.icon-btn[aria-pressed="false"] .ton-an { display: none; }
.icon-btn[aria-pressed="false"] .ton-aus { display: inline; }
@keyframes popEin { from { opacity: 0; transform: scale(.6); } }
@keyframes pop { 40% { transform: scale(1.18); } }
@keyframes einblenden { from { opacity: 0; transform: translateY(14px); } }
@keyframes hochein { from { opacity: 0; transform: translateY(14px); } }
@keyframes blink { 50% { opacity: .25; } }

/* ================= Bildschirme ================= */
.screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .18) transparent; }
.screen.rein { animation: screenein .55s var(--ease); }
@keyframes screenein { from { opacity: 0; transform: translateY(18px) scale(.99); } }
.zentriert > .inhalt, .zentriert > .pause-inner { position: relative; min-height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
  margin: 0 auto; padding: clamp(16px, 3vh, 40px) clamp(16px, 4vw, 48px) clamp(28px, 5vh, 56px); }
.pille-kicker { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: rgba(23, 255, 192, .08);
  box-shadow: inset 0 0 0 1px rgba(23, 255, 192, .32); color: var(--mint); font-size: .72rem; font-weight: 850; letter-spacing: .15em; text-transform: uppercase; }
.pille-kicker::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
.pille-kicker.ohne::before { display: none; }
.kicker { margin: 0; font-size: .72rem; font-weight: 850; letter-spacing: .15em; text-transform: uppercase; color: var(--mint); }
.punkte { display: flex; gap: 5px; justify-content: center; margin-top: 10px; }
.punkte i { width: 8px; height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .2); }
.punkte i.an { width: 22px; background: var(--mint); }
.punkte i.fertig { background: rgba(23, 255, 192, .55); }
.mega { font-size: clamp(2.5rem, 5.4vw, 4.8rem); font-weight: 900; letter-spacing: -.03em; text-shadow: 0 8px 40px rgba(0, 0, 0, .45); }
.titel-gross, .titel { font-size: clamp(1.8rem, 3.2vw, 2.9rem); font-weight: 850; letter-spacing: -.022em; font-family: var(--display); }
.lead { color: var(--text-2); font-size: clamp(1rem, .35vw + .92rem, 1.2rem); line-height: 1.55; max-width: 40em; }
.karte { background: var(--karte); border-radius: 26px; box-shadow: inset 0 0 0 1px var(--kante), 0 40px 80px -40px rgba(0, 0, 0, .9); backdrop-filter: blur(12px); }

/* ================= Knöpfe (Pillen wie in der Serie) ================= */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; padding: 0 26px; border-radius: 999px;
  font-weight: 800; font-size: 1rem; line-height: 1.2; text-align: center; user-select: none; background: var(--mint); color: #000;
  box-shadow: 0 14px 34px -12px rgba(23, 255, 192, .7), inset 0 -3px 0 rgba(0, 0, 0, .12);
  transition: transform .2s var(--sprung), box-shadow .25s, background .25s, filter .2s, color .25s; }
.btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 18px 40px -12px rgba(23, 255, 192, .85), inset 0 -3px 0 rgba(0, 0, 0, .12); }
.btn:active { transform: scale(.96); }
.btn-gross { min-height: 60px; padding: 0 34px; font-size: 1.08rem; }
.btn-sekundaer { background: rgba(255, 255, 255, .07); color: var(--text); box-shadow: inset 0 0 0 1px var(--kante-2); }
.btn .pfeil { transition: transform .25s var(--sprung); }
.btn:hover .pfeil { transform: translateX(4px); }
.btn-winkt { animation: winken 3.2s 1.6s ease-in-out infinite; }
@keyframes winken { 0%, 82%, 100% { transform: none; } 86% { transform: scale(1.06) rotate(-1.5deg); } 90% { transform: scale(1.06) rotate(1.5deg); } 94% { transform: scale(1.03); } }
.btn-text { display: inline-flex; align-items: center; gap: 7px; font-size: .86rem; font-weight: 650; color: var(--text-3); padding: 8px 10px; border-radius: 99px; transition: color .2s, background .2s; }
.btn-text:hover { color: var(--text); background: rgba(255, 255, 255, .06); }

/* ================= Start: Titel, Welle, Flug durch den Raum ================= */
.start { width: 100%; max-width: 1200px; z-index: 1; }
.screen-start .mega span { display: inline-block; animation: wortEin .8s var(--sprung) both; }
.screen-start .mega span:nth-child(1) { animation-delay: .25s; } .screen-start .mega span:nth-child(2) { animation-delay: .38s; } .screen-start .mega span:nth-child(3) { animation-delay: .51s; }
.mega .wort-ki { background: linear-gradient(100deg, #FF8278, #FF2D87 60%, #B04DFF); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 8px 30px rgba(255, 45, 135, .35)); }
@keyframes wortEin { from { opacity: 0; transform: translateY(40px) rotate(6deg) scale(.8); } }
.start-visual { width: min(640px, 100%); margin: 6px 0 2px; animation: einblenden .7s .6s var(--ease) both; }
.welle { display: block; width: 100%; height: 96px; }
.welle-labels { display: flex; justify-content: space-between; margin-top: -10px; font-size: .68rem; font-weight: 850; letter-spacing: .2em; text-transform: uppercase; }
.welle-labels span:first-child { color: var(--mint); }
.welle-labels span:last-child { color: var(--pink); }
.screen-start .lead { margin: 14px 0 28px; animation: einblenden .7s .75s var(--ease) both; }
.start-aktion { display: flex; flex-direction: column; align-items: center; gap: 14px; animation: einblenden .7s .9s var(--ease) both; }
.start-fakten { list-style: none; padding: 0; margin: 26px 0 0; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; animation: einblenden .7s 1.05s var(--ease) both; }
.start-fakten li { padding: 7px 14px; border-radius: 99px; background: rgba(255, 255, 255, .05); box-shadow: inset 0 0 0 1px var(--kante); font-size: .86rem; color: var(--text-2); font-weight: 600; }
.sternenflug { position: absolute; inset: 0; pointer-events: none; overflow: hidden;
  --rx0: clamp(min(410px, 37vw), 30vw, 720px); --ry0: clamp(min(255px, 31vh), 28vh, 400px); --rx1: 64vw; --ry1: 60vh; --g: clamp(60px, 3.6vw, 100px); }
.flieg { position: absolute; left: 50%; top: 47%; width: var(--g); margin: calc(var(--g) / -2) 0 0 calc(var(--g) / -2); opacity: 0; will-change: transform, opacity;
  animation: raumflug var(--t) cubic-bezier(.5, .05, .8, .55) var(--d) infinite; }
.flieg > * { width: 100%; height: auto; display: block; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .45)); }
.flieg .flieg-gesicht { border-radius: 50%; aspect-ratio: 1; object-fit: cover; box-shadow: 0 0 0 3px #FF2D87, 0 0 30px rgba(255, 45, 135, .5); filter: grayscale(.4) contrast(1.05); }
.sw-chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: rgba(29, 29, 66, .9); box-shadow: inset 0 0 0 1px var(--kante-2);
  font: 700 .82rem/1 var(--code); color: #FFB3BF; white-space: nowrap; }
.sw-chip.mint { color: var(--mint); }
.sw-chip .ico { width: 15px; height: 15px; }
.rec-dot { width: 8px; height: 8px; border-radius: 50%; background: #FF3B4E; animation: blink 1s steps(2) infinite; }
.flieg .sw-chip { width: max-content; margin-left: -24px; font-size: clamp(.82rem, .85vw, 1.2rem); }
@keyframes raumflug {
  0% { opacity: 0; transform: translate(calc(var(--dx) * var(--rx0)), calc(var(--dy) * var(--ry0))) scale(.3) rotate(var(--r0)); }
  16% { opacity: .92; }
  80% { opacity: .92; }
  100% { opacity: 0; transform: translate(calc(var(--dx) * var(--rx1)), calc(var(--dy) * var(--ry1))) scale(1.45) rotate(calc(var(--r0) * -1)); }
}
.stern { position: absolute; left: 50%; top: 47%; width: 3px; height: 3px; margin: -1.5px; border-radius: 50%; background: #fff; opacity: 0;
  animation: sternflug var(--t) cubic-bezier(.55, 0, .9, .5) var(--d) infinite; }
@keyframes sternflug {
  0% { opacity: 0; transform: translate(calc(var(--dx) * var(--rx0) * .8), calc(var(--dy) * var(--ry0) * .8)) scale(.5); }
  25% { opacity: .55; }
  100% { opacity: 0; transform: translate(calc(var(--dx) * 70vw), calc(var(--dy) * 70vh)) scale(1.8); }
}

/* ================= Intro: die Deepfake-Werkbank ================= */
.screen-intro { display: grid; place-items: center; background: radial-gradient(80% 70% at 50% 50%, rgba(40, 6, 30, .35), rgba(2, 1, 8, .92)); }
.kit-kopf { position: absolute; top: calc(22px + env(safe-area-inset-top, 0px)); left: clamp(16px, 4vw, 48px); margin: 0; display: flex; align-items: center; gap: 10px;
  font: 500 12px/1 var(--mono); letter-spacing: .14em; color: rgba(255, 45, 135, .8); }
.kit-kopf i { width: 8px; height: 8px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 10px var(--pink); animation: blink 1s steps(2) infinite; }
.intro-buehne { width: min(980px, 100%); display: grid; place-items: center; min-height: 60vh; }
.beat { display: grid; justify-items: center; gap: 18px; text-align: center; width: 100%; }
.beat.rein { animation: beatein .55s var(--ease); }
.beat.raus { opacity: 0; transform: scale(1.02); filter: blur(10px); transition: opacity .18s, transform .18s, filter .18s; }
@keyframes beatein { 0% { opacity: 0; transform: scale(.96); filter: blur(12px); } 60% { filter: blur(0); } }
.beat-gross { margin: 0; font: italic 900 clamp(44px, 8vw, 112px)/1 var(--display); letter-spacing: -.025em; text-wrap: balance; }
.beat[data-art="frage"] .beat-gross { font-size: clamp(48px, 9vw, 124px); }
.beat[data-art="ring"] .beat-gross { font: 500 clamp(22px, 3vw, 34px)/1.3 var(--mono); font-style: normal; letter-spacing: .02em; color: var(--lilac); }
.beat-gross.flackern { animation: flackern .09s steps(1) 10; }
@keyframes flackern { 50% { font-family: var(--mono); font-style: normal; letter-spacing: -.06em; color: var(--pink); transform: translateX(4px) skewX(-6deg); } }
.beat-klein { margin: 0; font: 500 clamp(14px, 1.5vw, 18px)/1.5 var(--mono); color: var(--lilac); min-height: 1.5em; }
.beat-ergebnis { margin: 0; min-height: 1.4em; font: 600 14px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--pink); opacity: 0; transform: translateY(6px); transition: opacity .3s, transform .3s; }
.beat-ergebnis.an { opacity: 1; transform: none; }
.beat-medium { display: none; width: 100%; justify-items: center; }
.beat[data-art="audio"] .beat-medium { display: grid; }
.rec { display: none; }
.beat[data-art="audio"] .rec { display: grid; }
.rec { width: min(560px, 100%); gap: 10px; padding: 14px 18px; border-radius: 14px; background: rgba(20, 6, 22, .7); border: 1px solid rgba(255, 45, 135, .3); box-shadow: 0 0 60px -20px rgba(255, 45, 135, .5); }
.rec-kopf { display: flex; align-items: center; gap: 10px; font: 600 12px/1 var(--mono); letter-spacing: .14em; color: var(--pink); }
.rec-kopf b { margin-left: auto; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: 0; font-size: 14px; }
.rec-punkt { width: 10px; height: 10px; border-radius: 50%; background: var(--rot); animation: blink .8s steps(2) infinite; }
.rec-welle { width: 100%; height: 70px; display: block; }
.skip { position: absolute; right: clamp(16px, 4vw, 48px); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }

.app[data-screen="s-intro"] .screen-intro { position: fixed; inset: 0; z-index: 25; }
.screen-intro .kit-kopf { font-family: var(--code); }

/* ================= Level-Start wie in der Serie ================= */
.intro-level { max-width: 680px; }
.lv-icon { position: relative; width: clamp(110px, 11vw, 140px); margin: 22px auto 22px; animation: iconEin .9s .15s var(--sprung) both; }
.lv-icon > svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 22px 34px rgba(255, 45, 135, .5)); animation: schildWippen 3.6s 1.2s ease-in-out infinite; }
@keyframes iconEin { 0% { opacity: 0; transform: scale(.3) rotate(-25deg); } 70% { transform: scale(1.1) rotate(6deg); } }
@keyframes schildWippen { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-5deg) scale(1.03); } 75% { transform: rotate(5deg); } }
.intro-level .untertitel { color: var(--text-2); font-size: 1.15rem; margin-top: 8px; }
.lv-info { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 24px 0 30px; }
.lv-info span { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 99px; background: rgba(255, 255, 255, .05); box-shadow: inset 0 0 0 1px var(--kante); font-size: .92rem; color: var(--text-2); font-weight: 600; }
.lv-info b { color: var(--text); }
.lv-info .ico { color: var(--mint); }
.screen-level .inhalt > * { animation: einblenden .6s var(--ease) both; }
.screen-level .inhalt > :nth-child(1) { animation-delay: .05s; } .screen-level .inhalt > :nth-child(3) { animation-delay: .35s; }
.screen-level .inhalt > :nth-child(4) { animation-delay: .45s; } .screen-level .inhalt > :nth-child(5) { animation-delay: .6s; } .screen-level .inhalt > :nth-child(6) { animation-delay: .75s; }
.screen-level .lv-icon { animation: iconEin .9s .15s var(--sprung) both; }

/* ================= Spiel: links Gerät, rechts Lage + Untertitel ================= */
.screen-spiel { overflow: hidden; }
/* Telefon und rechte Spalte teilen sich dieselbe Mitte: oben und unten gleich viel Luft */
.buehne { height: 100%; max-width: 1560px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) var(--panel-b);
  grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "geraet lage" "geraet dialog";
  gap: clamp(12px, 1.6vw, 24px) clamp(16px, 2vw, 32px); padding: clamp(14px, 2.2vh, 28px) clamp(14px, 2.2vw, 36px); }
.geraet-spalte { grid-area: geraet; }
.lage { grid-area: lage; }
.dialog { grid-area: dialog; }

/* Lage als Karte oben rechts */
.lage { position: relative; display: grid; gap: 8px; padding: 18px 20px 20px; border-radius: 22px; overflow: hidden; }
.lage::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--mint), transparent); opacity: 0; }
.lage.neu { animation: lagein .8s var(--ease); }
.lage.neu::before { animation: lichtlauf 1.6s .2s var(--ease); }
@keyframes lagein { from { opacity: 0; transform: translateY(-12px); } }
@keyframes lichtlauf { 0% { opacity: 1; transform: translateX(-100%); } 100% { opacity: 0; transform: translateX(100%); } }
.lage-kopf { display: flex; justify-content: space-between; gap: 10px; font-size: .7rem; font-weight: 850; letter-spacing: .15em; text-transform: uppercase; color: var(--mint); }
.lage-zeit { color: var(--text-3); font-variant-numeric: tabular-nums; }
.lage-titel { font-size: clamp(1.25rem, 1.4vw + .4rem, 1.6rem); font-weight: 850; letter-spacing: -.015em; text-wrap: balance; }
.lage-text { color: var(--text-2); line-height: 1.55; font-size: .95rem; }
.lage-toggle { display: none; }

/* Gerät */
.geraet-spalte { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; height: 100%; min-height: 0; }
.geraet { position: relative; display: flex; align-items: center; justify-content: center; flex: 1 1 auto; width: 100%; min-height: 0; container-type: size; }
.geraet .win { display: none; }
.geraet[data-art="teams"] .phone { display: none; }
.geraet[data-art="teams"] .win { display: grid; }

/* Höhe auch an der Breite begrenzt – so bleibt das Telefon ein Telefon, statt schmal und lang zu werden */
.phone { position: relative; height: min(700px, calc(100cqh - 26px), calc((100cqw - 12px) * 19 / 9)); aspect-ratio: 9 / 19; border-radius: 46px; padding: 0; overflow: hidden;
  background: radial-gradient(120% 60% at 50% 0%, #2B1C72 0%, #150D3E 55%, #0A0626 100%);
  box-shadow: 0 0 0 9px #17132E, 0 0 0 10px #4A4080, 0 0 0 11px #120E26, 0 40px 80px -30px rgba(0,0,0,.85), 0 0 90px -24px rgba(108,75,232,.55);
  display: grid; grid-template-rows: auto 1fr auto; transition: transform .5s var(--ease); }
.phone::after { content: ""; position: absolute; inset: 0; z-index: 6; pointer-events: none; border-radius: inherit;
  background: linear-gradient(125deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 32%, rgba(255,255,255,0) 70%, rgba(255,255,255,.03) 100%); }
.phone-status { display: flex; align-items: center; justify-content: space-between; padding: 16px 9% 0 11%; font: 600 12px/1 var(--display); font-variant-numeric: tabular-nums; position: relative; z-index: 3; }
.phone-notch { position: absolute; left: 50%; top: 10px; width: 30%; height: 24px; border-radius: 14px; background: #03020a; transform: translateX(-50%); }
.phone-icons { display: flex; gap: 3px; align-items: flex-end; }
.phone-icons i { display: block; width: 4px; background: var(--text); border-radius: 1px; }
.phone-icons i:nth-child(1) { height: 5px; } .phone-icons i:nth-child(2) { height: 8px; } .phone-icons i:nth-child(3) { height: 11px; }
.phone-sperre, .phone-anruf, .phone-tasten { display: none; }
.phone-sperre, .phone-anruf { grid-row: 2; }
.phone-tasten { grid-row: 3; }
.geraet[data-zustand="ruhe"] .phone-sperre { display: grid; }
.geraet:not([data-zustand="ruhe"]) .phone-anruf { display: grid; }
.geraet[data-zustand="ring"] .phone-tasten-ring { display: flex; }
.geraet[data-zustand="talk"] .phone-tasten-talk { display: flex; }

/* Sperrbildschirm: nur Uhrzeit und Tag */
.phone-sperre { align-content: start; justify-items: center; padding: 22% 12px 0; gap: 6px; }
.sperre-uhr { font: 300 clamp(48px, 9vh, 76px)/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; animation: hochein .6s var(--ease); }
.sperre-datum { font: 500 15px/1 var(--display); color: var(--lilac); }

.phone-anruf { align-content: start; justify-items: center; text-align: center; padding: 11% 18px 0; gap: 6px; }
.geraet[data-zustand="ring"] .phone-anruf { animation: anrufein .5s var(--ease); }
@keyframes anrufein { from { opacity: 0; transform: translateY(-24px); } }
.ph-kanal { margin: 0 0 6px; font: 600 11px/1.3 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--lilac); }
.geraet[data-zustand="talk"] .ph-kanal, .geraet[data-zustand="ende"] .ph-kanal { visibility: hidden; }
.ph-avatar-wrap { position: relative; width: clamp(150px, 22vh, 210px); aspect-ratio: 1; display: grid; place-items: center; margin: 4px 0 10px; }
.ph-ring { position: absolute; inset: -20%; width: 140%; height: 140%; }
.ph-avatar { position: relative; width: 52%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; overflow: hidden;
  background: var(--farbe, #4a4a7a); font: 700 clamp(22px, 3vh, 30px)/1 var(--display); color: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.08), 0 14px 30px -10px rgba(0,0,0,.6); }
.ph-avatar img { width: 100%; height: 100%; object-fit: cover; }
.ph-avatar.klein { width: 44px; font-size: 16px; }
.ph-name { margin: 0; font: 700 clamp(22px, 3vh, 28px)/1.15 var(--display); overflow-wrap: anywhere; }
.ph-zeile { margin: 0; font: 500 13px/1.4 var(--mono); color: var(--lilac); }
.ph-timer { margin: 6px 0 0; min-height: 1em; font: 500 15px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--aqua); }

.phone-tasten { justify-content: space-around; align-items: flex-end; padding: 0 24px 30px; z-index: 3; }
.taste { display: grid; justify-items: center; gap: 8px; font: 500 12px/1 var(--display); color: var(--lilac); }
.rund { width: 66px; height: 66px; border-radius: 50%; border: 0; display: grid; place-items: center; color: #fff; transition: transform .15s, filter .15s; }
.rund .ico { width: 30px; height: 30px; }
.rund-ja { background: var(--gruen); animation: pulsieren 1.2s ease-in-out infinite; }
.rund-nein { background: var(--rot); }
.rund-deko { background: rgba(255,255,255,.1); width: 54px; height: 54px; color: var(--lilac); }
.rund-deko .ico { width: 24px; height: 24px; }
@keyframes pulsieren { 0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,.6); } 50% { box-shadow: 0 0 0 16px rgba(34,197,94,0); } }
.rund:hover { filter: brightness(1.12); transform: scale(1.05); }

.geraet[data-zustand="ring"]:not([data-art="teams"]) .phone { animation: vibrieren 3s ease-in-out infinite; }
@keyframes vibrieren {
  0%, 22%, 100% { transform: none; }
  2%, 6%, 10%, 14%, 18% { transform: translateX(-3px) rotate(-.6deg); }
  4%, 8%, 12%, 16%, 20% { transform: translateX(3px) rotate(.6deg); }
}
.geraet.wackeln .phone, .geraet.wackeln .win { animation: nein .4s; }
@keyframes nein { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

/* Video */
/* Kamera aus: Profilbild statt Video, Ring atmet mit der Stimme (wie bei WhatsApp) */

/* Teams-artiges Fenster (angelehnt an das aktuelle Teams im dunklen Design)
   Vor dem Anruf: Posteingang mit Suchleiste. Im Anruf: Leiste mit Zeit und Name links,
   Steuerung rechts (Kamera, Mikro, Teilen, rotes Auflegen), große Kachel mit Avatar,
   Namensschild unten links, eigene Kachel unten rechts.
   Ebenen im Inhalt: Posteingang (1, nimmt keine Klicks an) < Kachel (2) < Anruf-Hinweis (3) */
.win { --teams: #7F85F5; --teams-tief: #5B5FC7; --flaeche: #1F1D2B; --leiste: #262433;
  width: min(100%, 780px); max-height: 100%; aspect-ratio: 16 / 10.5; border-radius: 12px; overflow: hidden; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); container-type: inline-size;
  background: var(--flaeche); box-shadow: 0 0 0 1px #34314a, var(--licht), 0 40px 80px -30px rgba(0,0,0,.85), 0 0 90px -24px rgba(91,95,199,.45); }
.win-titel { display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 8px 12px 8px 14px; background: var(--leiste); border-bottom: 1px solid rgba(255,255,255,.05); font: 600 12px/1 var(--display); color: #D6D6E4; }
.win-dots { display: flex; gap: 6px; }
.win-dots i { width: 10px; height: 10px; border-radius: 50%; background: #45415e; }
/* Titelleiste vor dem Anruf: Startmenü und App-Name links, Suche in der Mitte, Glocke, Einstellungen und Profilbild rechts */
.win-app { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 320px) minmax(0, 1fr); align-items: center; gap: 14px; min-width: 0; }
.wa-name { justify-self: start; display: inline-flex; align-items: center; gap: 9px; font: 600 13px/1 var(--display); color: #fff; }
.wa-name .ico { width: 16px; height: 16px; stroke-width: 3.2; color: #9C99B5; }
.wa-rechts { justify-self: end; display: inline-flex; align-items: center; gap: 14px; color: #9C99B5; }
.wa-rechts .ico { width: 17px; height: 17px; }
.wa-ich { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: #3B3860; color: #D6D6E4; }
.wa-ich .ico { width: 17px; height: 17px; }
.win-suche { display: inline-flex; align-items: center; gap: 8px; width: 100%; padding: 7px 12px; border-radius: 8px; background: rgba(255,255,255,.07); color: #9C99B5; font: 500 12px/1 var(--display); }
.win-suche .ico { width: 15px; height: 15px; }
.win-call { display: none; flex: 1; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
.geraet[data-zustand="talk"] .win-app, .geraet[data-zustand="ende"] .win-app { display: none; }
.geraet[data-zustand="talk"] .win-call, .geraet[data-zustand="ende"] .win-call { display: flex; }
.win-call-info { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; }
.win-call-info b { font: 600 13px/1 var(--mono); color: #fff; font-variant-numeric: tabular-nums; }
.win-call-info span { overflow: hidden; text-overflow: ellipsis; color: #B9B6D0; }
.win-steuer { display: flex; align-items: center; gap: 4px; }
.wsym { display: grid; place-items: center; width: 36px; height: 34px; border-radius: 6px; color: #D6D6E4; }
.wsym .ico { width: 19px; height: 19px; }
.wsym-aus { color: #9C99B5; }
.wtrenner { width: 1px; height: 22px; background: rgba(255,255,255,.12); margin: 0 4px; }
.wbtn-auflegen { display: inline-flex; align-items: center; gap: 7px; margin-left: 6px; padding: 8px 14px; border: 0; border-radius: 6px; background: #C4314B; color: #fff; font: 600 13px/1 var(--display); transition: filter .15s; }
.wbtn-auflegen .ico { width: 18px; height: 18px; }
.wbtn-auflegen:hover { filter: brightness(1.12); }
.geraet:not([data-zustand="talk"]) .wbtn-auflegen { opacity: .4; pointer-events: none; }

.win-body { position: relative; display: grid; place-items: center; background: radial-gradient(90% 90% at 50% 45%, #2A2740, #1A1825); overflow: hidden; }
/* Posteingang vor dem Anruf: wie ein Mailprogramm – App-Leiste ganz links, oben die Symbolleiste (nur zur Zierde),
   darunter Ordner, Liste mit Kürzel, Absender, Uhrzeit und Betreff, rechts der Lesebereich */
.win-leer { display: none; position: absolute; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; background: #1B1926; }
.geraet[data-zustand="ruhe"] .win-leer, .geraet[data-zustand="ring"] .win-leer { display: grid;
  grid-template-columns: 46px clamp(130px, 20%, 180px) minmax(0, 1fr) minmax(0, 1.1fr); grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "leiste band band band" "leiste ordner liste lesen"; }
.mail-leiste { grid-area: leiste; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; background: #17151F; border-right: 1px solid rgba(255,255,255,.05); }
.mail-leiste i { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: #7D7A96; }
.mail-leiste i.an { color: var(--teams); background: rgba(127,133,245,.14); }
.mail-leiste .ico { width: 18px; height: 18px; }
.mail-leiste .ml-unten { margin-top: auto; }
.mail-band { grid-area: band; display: flex; align-items: center; gap: 15px; min-width: 0; overflow: hidden; padding: 7px 14px 7px 10px; background: #211F2E; border-bottom: 1px solid rgba(255,255,255,.06); color: #8E8AA8; }
.mail-band > .ico { width: 17px; height: 17px; }
.mb-trenner { flex: none; width: 1px; height: 18px; background: rgba(255,255,255,.1); }
.mo-neu { flex: none; display: flex; align-items: center; gap: 7px; margin-right: 2px; padding: 7px 12px; border-radius: 6px; background: var(--teams-tief); color: #fff; font: 600 12px/1 var(--display); white-space: nowrap; }
.mo-neu .ico { width: 15px; height: 15px; }
.mail-ordner { grid-area: ordner; display: flex; flex-direction: column; gap: 2px; padding: 12px 8px; background: #1E1C29; border-right: 1px solid rgba(255,255,255,.05); font: 500 12px/1.2 var(--display); color: #C9C6DD; white-space: nowrap; overflow: hidden; }
.mail-ordner small { padding: 2px 10px 8px; font: 600 10.5px/1 var(--display); letter-spacing: .04em; color: #7D7A96; }
.mo { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 6px; }
.mail-ordner .ico { width: 15px; height: 15px; color: #9C99B5; }
.mo.an { background: rgba(127,133,245,.16); color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 var(--teams); }
.mo.an .ico { color: var(--teams); }
.mo b { margin-left: auto; color: var(--teams); font-weight: 700; font-variant-numeric: tabular-nums; }
.mail-spalte { grid-area: liste; display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-width: 0; padding: 14px 14px 0; border-right: 1px solid rgba(255,255,255,.05); }
.mail-kopf { margin: 0 0 10px; display: flex; align-items: baseline; gap: 10px; font: 700 16px/1.1 var(--display); color: #fff; }
.mail-kopf em { margin-left: auto; font: 600 12px/1 var(--display); font-style: normal; color: var(--gold); font-variant-numeric: tabular-nums; }
.mail-tabs { margin: 0 0 4px; display: flex; gap: 18px; border-bottom: 1px solid rgba(255,255,255,.07); font: 600 12px/1 var(--display); color: #9C99B5; }
.mail-tabs span { padding-bottom: 8px; }
.mail-tabs .an { color: #fff; box-shadow: inset 0 -2px 0 var(--teams); }
.mails { list-style: none; margin: 0; padding: 0; display: grid; align-content: start; overflow: hidden;
  -webkit-mask-image: linear-gradient(#000 78%, transparent); mask-image: linear-gradient(#000 78%, transparent); }
.mails li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; grid-template-areas: "av von zeit" "av betreff betreff"; column-gap: 10px; row-gap: 2px; align-items: center;
  padding: 8px 8px 8px 10px; border-bottom: 1px solid rgba(255,255,255,.05); font: 400 12px/1.3 var(--display); color: #A9A6C2; }
.m-av { grid-area: av; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #fff; font: 700 11px/1 var(--display); font-style: normal; }
.m-von { grid-area: von; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #E6E4F2; font-size: 12.5px; }
.mails time { grid-area: zeit; font-size: 11px; color: #8E8AA8; font-variant-numeric: tabular-nums; }
.m-betreff { grid-area: betreff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mails li.ungelesen { background: rgba(127,133,245,.07); box-shadow: inset 3px 0 0 var(--teams); }
.mails li.ungelesen .m-von { color: #fff; font-weight: 700; }
.mails li.ungelesen .m-betreff { color: #B4B8FF; font-weight: 600; }
.mails li.ungelesen time { color: #B4B8FF; }
.mails li.gewaehlt { background: rgba(127,133,245,.2); }
.mails li.neu { animation: mailein .35s ease-out; }
@keyframes mailein { from { opacity: 0; transform: translateY(-8px); } }
/* Lesebereich: Betreff, Absender, der Text nur als graue Zeilen; beim Spam-Ansturm ist nichts ausgewählt */
.mail-lesen { grid-area: lesen; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; overflow: hidden; background: #1F1D2A; }
.ml-betreff { margin: 0; font: 700 15px/1.3 var(--display); color: #fff; }
.ml-von { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,.06); }
.ml-von .m-av { grid-area: auto; }
.ml-von span { display: grid; gap: 3px; min-width: 0; }
.ml-von b { font: 600 12.5px/1.2 var(--display); color: #E6E4F2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ml-von small, .ml-von time { font: 400 11px/1.2 var(--display); color: #8E8AA8; white-space: nowrap; }
.ml-text { display: grid; gap: 9px; }
.ml-text i { display: block; height: 7px; border-radius: 4px; background: rgba(255,255,255,.08); }
.ml-text i.absatz { height: 3px; background: none; }
.ml-leer { margin: auto; display: grid; justify-items: center; gap: 5px; text-align: center; font: 400 12px/1.3 var(--display); color: #8E8AA8; }
.ml-leer .ico { width: 46px; height: 46px; margin-bottom: 6px; stroke-width: 1.1; color: #5E5A7A; }
.ml-leer b { font-weight: 600; font-size: 13px; color: #C9C6DD; }
/* je schmaler das Fenster, desto mehr fällt weg: erst der Lesebereich, dann die Ordner, dann die App-Leiste */
@container (max-width: 680px) {
  .geraet[data-zustand="ruhe"] .win-leer, .geraet[data-zustand="ring"] .win-leer { grid-template-columns: 46px clamp(130px, 26%, 180px) minmax(0, 1fr); grid-template-areas: "leiste band band" "leiste ordner liste"; }
  .mail-lesen { display: none; }
  .mail-spalte { border-right: 0; }
}
@container (max-width: 520px) {
  .geraet[data-zustand="ruhe"] .win-leer, .geraet[data-zustand="ring"] .win-leer { grid-template-columns: 42px minmax(0, 1fr); grid-template-areas: "leiste band" "leiste liste"; }
  .mail-ordner, .wa-name, .wa-rechts > .ico { display: none; }
  .mo-neu span { display: none; }
  .mail-spalte { padding: 12px 12px 0; }
  .win-app { grid-template-columns: minmax(0, 1fr) auto; }
}
@container (max-width: 400px) {
  .geraet[data-zustand="ruhe"] .win-leer, .geraet[data-zustand="ring"] .win-leer { grid-template-columns: minmax(0, 1fr); grid-template-areas: "band" "liste"; }
  .mail-leiste { display: none; }
}

.win-kachel { display: none; position: relative; z-index: 2; justify-items: center; gap: 4px; text-align: center; }
.geraet[data-zustand="talk"] .win-kachel, .geraet[data-zustand="ende"] .win-kachel { display: grid; animation: hochein .5s var(--ease); }
.win .ph-avatar { font-size: clamp(22px, 3vh, 30px); box-shadow: none; }
.win-zeile { margin: 0; font: 500 11px/1.4 var(--mono); color: #8F8BAA; }
.win-namensschild, .win-selbst { display: none; }
.geraet[data-zustand="talk"] .win-namensschild, .geraet[data-zustand="ende"] .win-namensschild,
.geraet[data-zustand="talk"] .win-selbst, .geraet[data-zustand="ende"] .win-selbst { display: flex; }
.win-namensschild { position: absolute; z-index: 2; left: 12px; bottom: 12px; margin: 0; align-items: center; gap: 7px; max-width: calc(100% - 180px); padding: 6px 10px; border-radius: 6px; background: rgba(0,0,0,.45); font: 600 13px/1.2 var(--display); color: #fff; }
.win-namensschild .ico { width: 15px; height: 15px; color: #D6D6E4; }
.win-namensschild span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill-extern { flex: none; padding: 3px 7px; border-radius: 4px; background: rgba(255,210,77,.16); color: var(--gold); border: 1px solid rgba(255,210,77,.4); font: 600 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.win-selbst { position: absolute; z-index: 2; right: 12px; bottom: 12px; width: 132px; aspect-ratio: 16 / 10; border-radius: 8px; background: #2E2B40; border: 1px solid rgba(255,255,255,.08); align-items: center; justify-content: center; font: 600 11px/1 var(--display); color: #B9B6D0; }

/* Eingehender Anruf: dunkle Karte mit Avatar, Name und runden Knöpfen */
.win-toast { display: none; position: absolute; z-index: 3; right: 14px; bottom: 14px; width: min(340px, calc(100% - 28px)); padding: 16px; border-radius: 10px; background: #2B2938; box-shadow: 0 24px 50px -12px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.07), var(--licht); gap: 16px; }
.geraet[data-zustand="ring"] .win-toast { display: grid; animation: toastein .45s cubic-bezier(.2,.9,.3,1.3); }
@keyframes toastein { from { opacity: 0; transform: translateY(30px) scale(.95); } }
.win-toast-kopf { display: flex; align-items: center; gap: 12px; text-align: left; min-width: 0; }
.win-toast-kopf > div { min-width: 0; }
.win-toast-name { margin: 0; font: 700 15px/1.25 var(--display); color: #fff; overflow-wrap: anywhere; }
.win-toast-zeile { margin: 3px 0 0; font: 500 12px/1.3 var(--display); color: #B9B6D0; overflow-wrap: anywhere; }
.win-toast-tasten { display: flex; justify-content: flex-end; gap: 12px; }
.trund { width: 44px; height: 44px; border-radius: 50%; border: 0; display: grid; place-items: center; color: #fff; transition: filter .15s, transform .15s; }
.trund .ico { width: 20px; height: 20px; }
.trund-ja { background: #13A10E; }
.trund-ja#win-annehmen { animation: pulsieren 1.2s ease-in-out infinite; }
.trund-nein { background: #C4314B; }
.trund:hover { filter: brightness(1.12); transform: scale(1.06); }
/* Schmales Fenster: Nebensächliches zuerst ausblenden, Auflegen bleibt immer sichtbar */
@container (max-width: 700px) { .wsym-extra { display: none; } }
@container (max-width: 560px) {
  .win-call-info span { display: none; }
  .wbtn-auflegen span { display: none; }
  .wbtn-auflegen { padding: 8px 10px; }
  .win-selbst { width: 96px; }
  .win-namensschild { max-width: calc(100% - 130px); font-size: 12px; }
  .win .ph-avatar-wrap { width: 108px; margin: 0 0 6px; }
  .win-zeile { font-size: 10px; }
}
@container (max-width: 420px) {
  .win-selbst { width: 68px; }
  .win-zeile { display: none; }
  .win-namensschild { max-width: calc(100% - 96px); }
}

.geraet-ende { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); margin: 0; z-index: 7; padding: 10px 18px; border-radius: 999px; background: rgba(10,6,34,.88); border: 1px solid var(--line); font: 600 13px/1 var(--mono); color: var(--lilac); white-space: nowrap; animation: hochein .4s var(--ease); }
.geraet[data-zustand="ende"] .phone, .geraet[data-zustand="ende"] .win { filter: saturate(.5) brightness(.7); transition: filter .8s; }
.ablehnen-tipp { margin: 0; padding: 10px 14px; border-radius: 12px; background: rgba(255,210,77,.1); color: var(--gold); font: 500 13px/1.4 var(--mono); text-align: center; }

/* Dialog */
.dialog { display: grid; gap: 14px; align-content: center; min-height: 0; max-height: 100%; }
.cc { display: grid; grid-template-rows: auto minmax(0, 1fr); padding: 16px 18px; border-radius: var(--radius); background: rgba(8,5,26,.62); border: 1px solid var(--kante); box-shadow: var(--licht); min-height: 160px; max-height: min(48vh, 440px); }
.cc-kopf { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.cc-schalter { display: inline-flex; align-items: center; gap: 9px; padding: 6px 7px 6px 12px; border-radius: 99px; box-shadow: inset 0 0 0 1px var(--kante-2);
  font: 700 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--text-2); transition: box-shadow .2s, color .2s; }
.cc-schalter:hover { box-shadow: inset 0 0 0 1px rgba(23, 255, 192, .5); }
.cc-punkt { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.geraet-spalte:has(.geraet.spricht) ~ .dialog .cc-punkt { background: var(--rot); animation: blink 1s steps(2) infinite; }
.schalter { position: relative; width: 30px; height: 18px; border-radius: 99px; background: rgba(255, 255, 255, .16); transition: background .2s; }
.schalter::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .25s var(--ease), background .2s; }
.cc-schalter[aria-checked="true"] { color: var(--mint); box-shadow: inset 0 0 0 1px rgba(23, 255, 192, .45); }
.cc-schalter[aria-checked="true"] .schalter { background: var(--mint); }
.cc-schalter[aria-checked="true"] .schalter::after { transform: translateX(12px); background: var(--aqua-ink); }
.cc-nochmal { padding: 4px 6px; font-size: 12px; }
.cc-log { overflow-y: auto; display: grid; gap: 14px; align-content: start; scroll-behavior: smooth; padding-right: 4px; }
.cc-leer { margin: 0; font: 500 13px/1.4 var(--mono); color: var(--dim); }
.cc-zeile { display: grid; gap: 4px; animation: hochein .35s var(--ease); }
.cc-wer { font: 600 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--aqua); }
.cc-zeile p { margin: 0; font: 500 17px/1.5 var(--display); }
.cc-anrufer p span { opacity: .16; transition: opacity .2s; }
.cc-anrufer p span.an { opacity: 1; }
.cc-du { justify-items: end; text-align: right; }
.cc-du .cc-wer { color: var(--lilac); }
.cc-du p { padding: 10px 14px; border-radius: 14px 14px 4px 14px; background: rgba(108,75,232,.32); max-width: 92%; font-size: 15px; }
.ohne-cc .dialog .cc-log { display: none; }
.ohne-cc .dialog .cc-kopf { margin-bottom: 0; }
.ohne-cc .dialog .cc { flex: none; min-height: 0; padding-block: 10px; }

.wahl { display: grid; gap: 10px; }
.wahl-label { margin: 0; font: 600 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--aqua); }
.wahl-optionen { display: grid; gap: 10px; }
.option { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 15px 18px; border-radius: 14px; border: 1px solid rgba(53,240,192,.28); background: linear-gradient(160deg, rgba(53,240,192,.09), rgba(53,240,192,.03));
  font: 600 16px/1.35 var(--display); color: var(--text); transition: background .15s, border-color .15s, transform .15s, box-shadow .15s; box-shadow: var(--licht); }
.wahl.rein .option { animation: hochein .45s var(--ease) backwards; animation-delay: calc(var(--i) * .08s); }
.option:hover { background: rgba(53,240,192,.16); border-color: var(--aqua); transform: translateX(3px); box-shadow: 0 0 30px -12px rgba(53,240,192,.6); }
.option kbd { flex: none; }

/* Urteil im Panel – zwei große Pillen wie die Antwortknöpfe der Serie */
.urteil { display: grid; gap: 10px; padding: 18px; border-radius: 22px; text-align: center; animation: einblenden .45s var(--ease) both; }
.urteil-frage { font-size: clamp(1.3rem, 1.6vw, 1.7rem); font-weight: 900; letter-spacing: -.02em; text-wrap: balance; }
.urteil-tasten { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.urteil-btn { position: relative; display: grid; justify-items: center; gap: 4px; padding: 16px 10px 14px; border-radius: 20px;
  transition: transform .2s var(--sprung), box-shadow .25s, opacity .3s, filter .2s; animation: popEin .5s var(--sprung) both; }
.urteil-btn.fake { animation-delay: .08s; }
.urteil-btn .ico { width: 30px; height: 30px; stroke-width: 2.2; }
.urteil-btn b { font-size: 1.3rem; font-weight: 900; letter-spacing: .04em; }
.urteil-btn kbd { position: absolute; top: 8px; right: 8px; background: rgba(0, 0, 0, .12); color: inherit; opacity: .7; }
.urteil-btn.echt { background: var(--mint); color: #00261C; box-shadow: 0 14px 34px -12px rgba(23, 255, 192, .7), inset 0 -3px 0 rgba(0, 0, 0, .12); }
.urteil-btn.fake { background: var(--koralle); color: #3A0400; box-shadow: 0 14px 34px -12px rgba(255, 130, 120, .7), inset 0 -3px 0 rgba(0, 0, 0, .12); }
.urteil-btn:hover { transform: translateY(-3px) scale(1.03); }
.urteil-btn.gewaehlt { transform: scale(1.05); filter: brightness(1.08); }
.urteil-btn.abgewaehlt { opacity: .25; transform: scale(.96); }

/* ================= Feedback im Panel wie in der Phishing Challenge =================
   Ersetzt rechts Lage und Dialog (schmal: Lage, Dialog und das große Telefon).
   Schritt 1: Ergebnis, Rückmeldung, das Entscheidende. Schritt 2: Hinweise einzeln, zum Schluss „Das schützt dich“.
   Die Knöpfe kleben unten am Panel. */
#s-spiel[data-phase="feedback"] .lage, #s-spiel[data-phase="feedback"] .dialog { display: none; }
.fb { --pad: clamp(20px, 1.8vw, 30px); grid-column: 2; grid-row: 1 / span 2; position: relative; display: flex; flex-direction: column; min-height: 0;
  padding: var(--pad) var(--pad) 0; border-radius: 28px; background: var(--karte-fest); box-shadow: inset 0 0 0 1px var(--kante), 0 40px 80px -40px rgba(0, 0, 0, .9);
  overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .18) transparent; }
.fb.rein { animation: seiteRein .55s .05s var(--sprung) both; }
@keyframes seiteRein { from { opacity: 0; transform: translateY(24px) scale(.97); } }
.fb-kopf { display: flex; gap: 14px; align-items: center; }
.fb-ikon { width: 58px; height: 58px; flex: none; }
.fb-ikon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
.fb-ja .fb-ikon { color: var(--mint); filter: drop-shadow(0 0 14px rgba(23, 255, 192, .55)); animation: hupf .6s .1s var(--sprung) both; }
.fb-nein .fb-ikon { color: var(--koralle); filter: drop-shadow(0 0 14px rgba(255, 130, 120, .5)); }
.fb-ikon circle { opacity: .4; stroke-dasharray: 132; stroke-dashoffset: 132; animation: zeichnen .6s .1s var(--ease) forwards; }
.fb-ikon path { stroke-dasharray: 44; stroke-dashoffset: 44; animation: zeichnen .45s .4s var(--ease) forwards; }
.fb-nein .fb-kopf { animation: wackeln .5s .35s ease; }
@keyframes zeichnen { to { stroke-dashoffset: 0; } }
@keyframes wackeln { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
@keyframes hupf { 0% { transform: scale(.3); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
.fb-titel { font-size: clamp(1.6rem, 1.5vw + .9rem, 2.2rem); font-weight: 900; letter-spacing: -.02em; }
.fb-ja .fb-titel { color: var(--mint); }
.fb-nein .fb-titel { color: var(--koralle); }
.fb-wahr { color: var(--text-2); font-size: .96rem; line-height: 1.5; margin-top: 5px; animation: einblenden .5s .2s var(--ease) both; }
.fb-kern { margin: 18px 0 20px; padding: 13px 15px 14px 17px; border-radius: 16px; background: rgba(255, 255, 255, .05);
  box-shadow: inset 3px 0 0 var(--violet); animation: einblenden .5s .35s var(--ease) both; }
.fb-kern-label { display: block; margin-bottom: 4px; font-size: .66rem; font-weight: 900; letter-spacing: .13em; text-transform: uppercase; color: #AE9BFF; }
.fb-kern p { font-size: 1.02rem; font-weight: 700; line-height: 1.45; text-wrap: pretty; }
.fb-hinweise { display: flex; flex-direction: column; }
.fb[data-stufe="1"] .fb-hinweise { display: none; }
.fb[data-stufe="2"] .fb-hinweise { animation: einblenden .45s var(--ease) both; }
.fb[data-stufe="2"] .fb-wahr, .fb[data-stufe="2"] .fb-kern { animation: none; }
.fb-zaehler { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: .72rem; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; }
.fb-dots { display: flex; gap: 5px; align-items: center; }
.fb-dots i { width: 7px; height: 7px; border-radius: 99px; background: rgba(255, 255, 255, .18); transition: width .35s var(--ease), background .3s; }
.fb-dots i.an { background: var(--text-3); }
.fb-dots i.jetzt { width: 22px; background: var(--text); }
/* Hinweiskarten: Warnsignal (rot), spricht für echt (mint), gut zu wissen (lila), das schützt dich (mint) */
.h-liste { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.h-karte { --c: #FF6B81; --cw: rgba(255, 107, 129, .2); border-radius: 18px; background: rgba(255, 255, 255, .04); box-shadow: inset 0 0 0 1px var(--kante);
  transition: background .35s, box-shadow .35s, opacity .35s; animation: karteEin .5s var(--sprung) both; animation-delay: calc(.1s + var(--i) * .08s); }
.h-gruen, .h-schutz { --c: var(--mint); --cw: rgba(23, 255, 192, .16); }
.h-info { --c: #AE9BFF; --cw: rgba(174, 155, 255, .2); }
@keyframes karteEin { from { opacity: 0; transform: translateX(26px); } }
.h-karte:not(.aktiv) { opacity: .7; }
.h-karte:not(.aktiv):hover { opacity: 1; background: rgba(255, 255, 255, .06); }
.h-karte.aktiv { background: rgba(255, 255, 255, .08); box-shadow: inset 0 0 0 2px var(--c), 0 18px 40px -26px var(--c); }
.h-kopf { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; text-align: left; border-radius: 18px; }
.h-nr { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none;
  background: var(--cw); color: var(--c); box-shadow: inset 0 0 0 1.5px var(--c); transition: transform .35s var(--sprung), background .3s, color .3s; }
.h-nr .ico { width: 18px; height: 18px; stroke-width: 2.3; }
.h-karte.aktiv .h-nr { background: var(--c); color: #15093A; transform: scale(1.08); animation: nrPuls 1.8s ease-in-out infinite; }
@keyframes nrPuls { 50% { box-shadow: 0 0 0 8px var(--cw); } }
.h-kopf-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.h-art { font-size: .66rem; font-weight: 900; letter-spacing: .13em; text-transform: uppercase; color: var(--c); }
.h-titel { font-size: 1.02rem; font-weight: 750; line-height: 1.3; }
.h-chev { color: var(--text-3); transition: transform .35s var(--ease); }
.h-karte.aktiv .h-chev { transform: rotate(180deg); }
.h-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .42s var(--ease); }
.h-karte.aktiv .h-body { grid-template-rows: 1fr; }
.h-body-innen { overflow: hidden; min-height: 0; }
.h-body p { padding: 0 16px 16px 58px; color: var(--text-2); font-size: .98rem; line-height: 1.58; }
.fb-aktionen { position: sticky; bottom: 0; z-index: 2; display: flex; flex-direction: column; margin: auto calc(-1 * var(--pad)) 0; padding: 18px var(--pad) var(--pad);
  background: linear-gradient(rgba(39, 38, 78, 0), var(--karte-fest) 18px); animation: einblenden .5s .5s var(--ease) both; }
.fb-aktionen .btn { width: 100%; }
.btn-primaer { background: linear-gradient(180deg, #8B6EFF, #5B3FE0); color: #fff; box-shadow: 0 12px 28px -12px rgba(123, 92, 255, .85), inset 0 1px 0 rgba(255, 255, 255, .22); }
.btn-primaer:hover { box-shadow: 0 16px 34px -12px rgba(123, 92, 255, .95), inset 0 1px 0 rgba(255, 255, 255, .22); }
.btn-primaer.final { background: var(--mint); color: #000; box-shadow: 0 14px 34px -12px rgba(23, 255, 192, .7), inset 0 -3px 0 rgba(0, 0, 0, .12); }
.link-btn { align-self: center; font-size: .84rem; color: var(--text-3); text-decoration: underline; text-underline-offset: 3px; padding: 10px 12px 0; transition: color .2s, opacity .3s; }
.link-btn:hover { color: var(--text-2); }
.link-btn.weg { opacity: 0; pointer-events: none; }

/* Hacker-Sprechblase im Ergebnis (Auswertung) */
.hacker-sagt { display: flex; align-items: flex-end; gap: 14px; }
.hacker-sagt img { width: 58px; height: auto; flex: none; animation: hackerein .5s cubic-bezier(.2,.9,.3,1.4) .5s backwards; }
@keyframes hackerein { from { opacity: 0; transform: translateY(20px) scale(.8); } }
.hacker-sagt p { position: relative; margin: 0 0 16px; padding: 11px 15px; border-radius: 16px 16px 16px 4px; background: #2A285C; font: 500 14px/1.45 var(--mono); max-width: 60ch; min-height: 2.6em; }
.hacker-sagt[data-stimmung="froh"] p { background: rgba(255,45,135,.18); color: #FFD3E6; }
.hacker-sagt[data-stimmung="froh"] img { animation: hackerein .5s cubic-bezier(.2,.9,.3,1.4) .5s backwards, huepfen .5s ease-in-out 1.1s 3 alternate; }
@keyframes huepfen { to { transform: translateY(-8px); } }
@keyframes knall { from { opacity: 0; transform: rotate(-8deg) scale(2.4); } }
.regel h3 { margin: 0; font: 600 12px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--lilac); }

/* ================= Pause ================= */
.screen-pause { display: block; }   /* .pause-inner zentriert sich selbst (margin auto, min-height 100 %) und wächst mit – langer Inhalt bleibt oben erreichbar */
.pause-inner { width: min(860px, 100%); display: grid; gap: 18px; padding-block: 32px; }
.pause-szene { margin: 0; font: 500 18px/1.6 var(--display); color: var(--lilac); max-width: 62ch; }
.pause-frage { margin: 6px 0 0; font: italic 800 26px/1.2 var(--display); }
.pause-optionen { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pause-option { animation: hochein .5s var(--ease) backwards; animation-delay: calc(.2s + var(--i) * .08s); }
.pause-option .p-icon { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--farbe); background: color-mix(in srgb, var(--farbe) 16%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--farbe) 35%, transparent); }
.pause-option .p-icon .ico { width: 22px; height: 22px; }
.pause-option .p-text { flex: 1; min-width: 0; }
.pause-option kbd { margin-left: auto; }
.pause-option[disabled] { cursor: default; transform: none; }
.pause-option.nicht { opacity: .4; }
.pause-option.gewaehlt[data-wert="voll"], .pause-option.loesung { border-color: var(--aqua); background: rgba(53,240,192,.16); opacity: 1; }
.pause-option.gewaehlt[data-wert="halb"] { border-color: var(--gold); background: rgba(255,210,77,.12); }
.pause-option.gewaehlt[data-wert="falsch"] { border-color: var(--pink); background: rgba(255,45,135,.12); }
.pause-antwort { padding: 18px 20px; border-radius: 16px; background: var(--glas); border: 1px solid var(--kante); box-shadow: var(--licht); animation: hochein .4s var(--ease); }
.pause-antwort h3 { margin: 0 0 6px; font: italic 800 22px/1.2 var(--display); }
.pause-antwort[data-wert="voll"] h3 { color: var(--aqua); }
.pause-antwort[data-wert="halb"] h3 { color: var(--gold); }
.pause-antwort[data-wert="falsch"] h3 { color: var(--pink); }
.pause-antwort p { margin: 0; line-height: 1.6; color: var(--lilac); }
.regel { display: grid; gap: 12px; }
/* die Rückruf-Regel steht in derselben Box wie die Rückmeldung, durch eine Linie getrennt */
.pause-antwort .regel { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--kante); gap: 10px; }
.pause-antwort .regel-punkte li { padding: 0; background: none; box-shadow: none; }
.pause-antwort h4 { margin: 0; font-size: .72rem; font-weight: 850; letter-spacing: .15em; text-transform: uppercase; color: var(--mint); }
.regel-punkte { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.regel-punkte li { display: grid; gap: 10px; align-content: start; padding: 16px; border-radius: 14px; background: rgba(53,240,192,.07); border: 1px solid rgba(53,240,192,.25);
  animation: hochein .5s var(--ease) backwards; animation-delay: calc(var(--i) * .12s); }
.regel-punkte .ico { color: var(--aqua); width: 26px; height: 26px; }
.regel-punkte b { display: block; font: 700 16px/1.3 var(--display); margin-bottom: 4px; }
.regel-punkte span { color: var(--lilac); font-size: 14px; line-height: 1.5; }

/* ================= Level-Auswertung: Halbkreis-Messer wie in der Serie ================= */
.le-karte { width: min(600px, 100%); padding: clamp(22px, 3vw, 34px) clamp(20px, 3vw, 36px) 24px; animation: karteHoch .7s var(--sprung) both; }
@keyframes karteHoch { from { opacity: 0; transform: translateY(60px) scale(.92); } }
.le-karte h1 { font-size: clamp(1.4rem, 2vw, 1.9rem); font-weight: 850; letter-spacing: -.015em; margin: 16px auto 6px; max-width: 22em; }
.messer { position: relative; width: min(280px, 72vw); margin: 10px auto 4px; }
.messer svg { width: 100%; height: auto; display: block; overflow: visible; }
.messer circle { fill: none; stroke-width: 16; stroke-linecap: round; }
.m-spur { stroke: rgba(255, 255, 255, .12); }
.m-wert { stroke: url(#messerVerlauf); transition: stroke-dashoffset 1.5s var(--ease); filter: drop-shadow(0 0 10px rgba(23, 255, 192, .45)); }
.m-marke line { stroke: rgba(255, 255, 255, .85); stroke-width: 2; }
.m-marke circle { fill: #fff; stroke: none; }
.m-mitte { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.m-symbol { width: 34px; height: 34px; color: var(--mint); animation: popEin .6s 1.2s var(--sprung) both; }
.m-symbol.nein { color: var(--koralle); }
.m-symbol svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.m-prozent { font-size: clamp(2.4rem, 4vw, 3.2rem); font-weight: 900; line-height: 1; letter-spacing: -.03em; }
.m-richtig { color: var(--text-2); font-size: .9rem; }
.m-label { position: absolute; display: flex; flex-direction: column; align-items: flex-start; font-size: .68rem; font-weight: 900; letter-spacing: .12em; text-transform: uppercase;
  color: var(--text-3); line-height: 1.2; white-space: nowrap; transform: translate(10px, -100%); }
.m-label b { font-size: 1.05rem; color: #fff; letter-spacing: 0; }
.le-hinweis { margin: 0 auto 4px; max-width: 30em; color: var(--text-2); font-size: .95rem; line-height: 1.5; }
.le-kacheln { display: flex; gap: 8px; justify-content: center; margin: 14px 0 6px; }
.le-kachel { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; animation: popEin .5s var(--sprung) both; animation-delay: calc(1s + var(--i) * .08s); }
.le-kachel .ico { width: 20px; height: 20px; stroke-width: 2.8; }
.le-kachel.ja { background: rgba(23, 255, 192, .14); color: var(--mint); box-shadow: inset 0 0 0 1px rgba(23, 255, 192, .35); }
.le-kachel.nein { background: rgba(255, 130, 120, .14); color: var(--koralle); box-shadow: inset 0 0 0 1px rgba(255, 130, 120, .35); }
/* Hacker-Beute statt Abzeichen: je weniger, desto besser */
.le-beute, .f-beute { display: inline-flex; align-items: center; gap: 12px; padding: 8px 20px 8px 8px; border-radius: 99px; text-align: left;
  background: rgba(255, 45, 135, .1); box-shadow: inset 0 0 0 1px rgba(255, 45, 135, .35); }
.le-beute { margin: 10px 0 2px; animation: popEin .6s 1.4s var(--sprung) both; }
.le-beute img, .f-beute img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; object-position: center 25%; background: #1B1450; }
.le-beute small { display: block; color: #FF9CC6; font-size: .66rem; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
.le-beute b { font-size: 1.1rem; color: #FFC2DC; font-variant-numeric: tabular-nums; }
.le-beute.null, .f-beute.null { background: rgba(23, 255, 192, .08); box-shadow: inset 0 0 0 1px rgba(23, 255, 192, .3); }
.le-beute.null small { color: var(--mint); } .le-beute.null b { color: #fff; }
.le-details { margin: 10px 0 4px; }
.le-details summary { list-style: none; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; color: var(--text-3); font-size: .86rem; font-weight: 650; padding: 6px 10px; border-radius: 99px; }
.le-details summary::-webkit-details-marker { display: none; }
.le-details summary:hover { color: var(--text); background: rgba(255, 255, 255, .06); }
.le-details summary .ico { transition: transform .2s; }
.le-details[open] summary .ico { transform: rotate(180deg); }
.le-liste { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; text-align: left; }
.le-liste li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: rgba(255, 255, 255, .04); box-shadow: inset 0 0 0 1px var(--kante); font-size: .92rem; }
.le-liste .le-titel { flex: 1; min-width: 0; font-weight: 620; }
.le-liste .ico { width: 18px; height: 18px; stroke-width: 2.6; }
.le-liste .ja .ico { color: var(--mint); } .le-liste .nein .ico { color: var(--koralle); }
.tag { flex: none; padding: 3px 9px; border-radius: 99px; font-size: .68rem; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
.tag-echt { background: rgba(23, 255, 192, .14); color: var(--mint); }
.tag-fake { background: rgba(255, 130, 120, .16); color: var(--koralle); }
.le-fuss { position: sticky; bottom: 0; z-index: 3; display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap;
  margin: 20px calc(-1 * clamp(20px, 3vw, 36px)) -24px; padding: 14px clamp(20px, 3vw, 36px) 18px; border-radius: 0 0 26px 26px;
  background: #27264E; box-shadow: inset 0 1px 0 var(--kante), 0 -14px 24px -16px rgba(0, 0, 0, .7); }

/* ================= Auswertung (wie das Ergebnis der Serie) ================= */
.finale { width: min(1060px, 100%); }
.f-kopf { display: flex; align-items: center; justify-content: center; gap: clamp(40px, 6vw, 110px); text-align: left; margin-bottom: 22px; }
.f-kopf .messer { width: min(250px, 60vw); margin: 0; flex: none; }
.f-kopf-text h1 { margin: 12px 0 8px; }
.f-zahlen { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 18px; }
.f-beute b { display: block; font-size: 1.6rem; font-weight: 900; color: #FFC2DC; font-variant-numeric: tabular-nums; line-height: 1.1; }
.f-beute.null b { color: var(--mint); }
.f-beute small, .f-nachgehakt small { display: block; color: var(--text-2); font-size: .82rem; }
.f-nachgehakt { padding: 10px 18px; border-radius: 99px; background: rgba(255, 255, 255, .05); box-shadow: inset 0 0 0 1px var(--kante); }
.f-nachgehakt b { font-size: 1.15rem; font-weight: 900; }
.finale > .hacker-sagt { align-self: center; margin-bottom: 18px; text-align: left; }
.f-raster { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; width: 100%; text-align: left; }
.f-block { padding: 20px 22px 22px; animation: karteHoch .7s var(--sprung) both; }
.f-block:nth-child(2) { animation-delay: .12s; }
.f-block h2 { font-size: .76rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); margin-bottom: 16px; }
.finale > .quellen { margin-top: 14px; text-align: center; }

/* Akte und Regeln (Auswertung) */
.akte, .regeln { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.akte li { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 14px; background: rgba(8,5,26,.45); border: 1px solid var(--kante);
  animation: hochein .5s var(--ease) backwards; animation-delay: calc(.6s + var(--i) * .16s); }
.akte-nr { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: rgba(185,174,226,.12); font: 600 14px/1 var(--mono); color: var(--lilac); }
.akte div { display: grid; gap: 3px; min-width: 0; }
.akte b { font: 700 15px/1.3 var(--display); }
.akte div span { font: 500 12px/1.3 var(--mono); color: var(--dim); }
.akte em { font: 600 11px/1 var(--mono); font-style: normal; letter-spacing: .12em; text-transform: uppercase; padding: 6px 9px; border-radius: 6px; border: 2px solid; transform: rotate(-4deg); white-space: nowrap;
  animation: knall .4s cubic-bezier(.3,1.6,.5,1) backwards; animation-delay: calc(.8s + var(--i) * .16s); }
.akte-entlarvt em, .akte-echtErkannt em { color: var(--aqua); }
.akte-getaeuscht em, .akte-zuSpaet em { color: var(--pink); }
.akte-fehlalarm em { color: var(--gold); }
.regeln { counter-reset: r; }
.regeln li { counter-increment: r; display: grid; grid-template-columns: 34px minmax(0, 1fr); column-gap: 14px; row-gap: 4px; padding: 14px 16px; border-radius: 14px; background: rgba(53,240,192,.06); border: 1px solid rgba(53,240,192,.2);
  animation: hochein .5s var(--ease) backwards; animation-delay: calc(1s + var(--i) * .12s); }
.regeln li::before { content: counter(r); grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--aqua); color: var(--aqua-ink); font: 800 16px/1 var(--display); }
.regeln b { font: 700 16px/1.3 var(--display); }
.regeln span { color: var(--lilac); font-size: 14px; line-height: 1.5; }
.quellen { margin: 0; font-size: .74rem; line-height: 1.6; color: var(--text-3); max-width: 90ch; }

/* ================= Serienlook für die übernommenen Teile ================= */
.cc { background: var(--karte); border: 0; border-radius: 22px; box-shadow: inset 0 0 0 1px var(--kante); }
.cc-zeile p { font-family: var(--font); font-weight: 550; }
.option { border-radius: 16px; font-family: var(--font); font-weight: 650; background: rgba(255, 255, 255, .05); border: 0; box-shadow: inset 0 0 0 1px rgba(23, 255, 192, .3); }
.option:hover { background: rgba(23, 255, 192, .12); box-shadow: inset 0 0 0 1.5px var(--mint), 0 0 30px -12px rgba(23, 255, 192, .6); }
.akte li { background: rgba(255, 255, 255, .04); border: 0; box-shadow: inset 0 0 0 1px var(--kante); }
.akte li { border-radius: 14px; }
.akte b, .regeln b { font-family: var(--font); }
.regeln li { background: rgba(23, 255, 192, .06); border: 0; box-shadow: inset 0 0 0 1px rgba(23, 255, 192, .2); }
.regeln li::before { font-family: var(--display); }
.hacker-sagt p { background: #2A2865; font-family: var(--font); font-weight: 600; }
.screen-pause .pause-inner { width: min(1040px, 100%); align-items: stretch; text-align: left; gap: 16px; }
.screen-pause .pause-inner > .kicker { align-self: flex-start; display: inline-flex; padding: 6px 14px; border-radius: 99px; background: rgba(23, 255, 192, .08); box-shadow: inset 0 0 0 1px rgba(23, 255, 192, .32); }
.pause-frage, .pause-antwort h3 { font-style: normal; font-weight: 850; font-family: var(--display); }
.pause-szene { font-family: var(--font); color: var(--text-2); }
.pause-antwort { background: var(--karte); border: 0; box-shadow: inset 0 0 0 1px var(--kante); border-radius: 20px; }
.regel-punkte li { background: rgba(23, 255, 192, .07); border: 0; box-shadow: inset 0 0 0 1px rgba(23, 255, 192, .25); }
/* Knöpfe am Ende der Frage und der Auswertung kleben unten (wie im Nugget); ragt der Inhalt über den Bildschirm, liegt ein Verlauf darunter */
.pause-fuss, .f-fuss { position: sticky; bottom: 0; z-index: 3; display: flex; align-items: center; gap: 10px; margin: -6px 0 -14px; padding: 18px 0 14px; }
.screen-pause.ueberlauf .pause-fuss, .screen-ende.ueberlauf .f-fuss { background: linear-gradient(rgba(11, 6, 51, 0), rgba(11, 6, 51, .96) 40%); }
.f-fuss { align-self: stretch; flex-direction: column; justify-content: center; margin-top: 14px; padding-top: 30px; }
.screen-ende.ueberlauf .f-fuss { background: linear-gradient(rgba(11, 6, 51, 0), rgba(11, 6, 51, .97) 26px); }
.f-lms { margin: 0; display: inline-flex; align-items: center; gap: 8px; color: var(--mint); font-size: .92rem; font-weight: 650; }

/* Vishing-Nugget im Sicherheitstipp: eine Lehre nach der anderen, danach die Frage */
.nugget, .pause-quiz { display: grid; gap: 16px; }
.pause-inner.rein { animation: screenein .55s var(--ease); }
/* Karte: Text links, Bild rechts (im Stil der Nugget-Bilder der Phishing Challenge) */
.nugget-karte { --farbe: var(--mint); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .95fr); gap: clamp(18px, 2.6vw, 34px); align-items: center;
  padding: clamp(20px, 3vw, 30px); border-radius: 22px; background: var(--karte); box-shadow: inset 0 0 0 1px var(--kante), inset 0 3px 0 color-mix(in srgb, var(--farbe) 75%, transparent); }
.nugget-karte.rein { animation: hochein .45s var(--ease); }
.nk-bild img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 16px; box-shadow: 0 0 0 1px var(--kante), 0 24px 44px -22px rgba(0, 0, 0, .85); }
.nk-einleitung { color: var(--text-2); line-height: 1.6; padding-bottom: 14px; margin-bottom: 4px; border-bottom: 1px solid var(--kante); }
.nk-liste { list-style: none; margin: 2px 0 0; padding: 0; display: grid; gap: 8px; }
.nk-liste li { display: grid; gap: 2px; padding: 9px 14px; border-radius: 12px; background: rgba(255, 255, 255, .04);
  box-shadow: inset 3px 0 0 var(--farbe), inset 0 0 0 1px var(--kante); animation: hochein .4s var(--ease) backwards; animation-delay: calc(.15s + var(--i) * .08s); }
.nk-liste b { font-weight: 750; }
.nk-liste span { color: var(--lilac); font-size: .92rem; line-height: 1.45; }
.nk-text { display: grid; gap: 8px; min-width: 0; }
.nk-nr { font-size: .72rem; font-weight: 850; letter-spacing: .15em; text-transform: uppercase; color: var(--farbe); }
.nk-text h3 { font-size: clamp(1.35rem, 1.2vw + .8rem, 1.75rem); font-weight: 850; letter-spacing: -.015em; }
.nk-inhalt { color: var(--text-2); line-height: 1.6; }
.nk-beispiel { margin-top: 6px; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: rgba(255, 255, 255, .04);
  box-shadow: inset 0 0 0 1px var(--kante); color: var(--lilac); font-size: .92rem; line-height: 1.5; }
.nk-beispiel .ico { color: var(--farbe); margin-top: 1px; }
.nk-beispiel b { color: var(--text); font-weight: 700; }
/* Die Knöpfe kleben unten wie in der Phishing Challenge; ist die Karte höher als der Bildschirm, liegt ein Verlauf darunter */
.nugget-nav { position: sticky; bottom: 0; z-index: 3; display: flex; align-items: center; gap: 14px; margin: -16px 0 -14px; padding: 18px 0 14px; }
.screen-pause.ueberlauf .nugget-nav { background: linear-gradient(rgba(11, 6, 51, 0), rgba(11, 6, 51, .96) 45%); }
.nugget-punkte { display: flex; gap: 6px; margin-right: auto; }
.nugget-punkte button { width: 10px; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .2); transition: width .3s var(--ease), background .3s; }
.nugget-punkte button.an { width: 26px; background: var(--mint); }
.nugget-punkte button.fertig { background: rgba(23, 255, 192, .55); }
.nugget-punkte button:disabled { cursor: default; }
.ablehnen-tipp { font-family: var(--font); }

/* Antworten im Gespräch: lila wie die eigenen Sprechblasen im Verlauf – so heben sie sich von den Untertiteln darüber ab */
.wahl-label { color: #B9A8FF; }
.wahl .option { border-radius: 16px 16px 4px 16px; background: rgba(108, 75, 232, .36); box-shadow: inset 0 0 0 1px rgba(174, 155, 255, .5), 0 12px 26px -16px rgba(108, 75, 232, .9); }
.wahl .option:hover { background: rgba(108, 75, 232, .55); box-shadow: inset 0 0 0 1.5px #AE9BFF, 0 0 30px -10px rgba(140, 110, 255, .85); }
.wahl .option kbd { color: #fff; background: rgba(255, 255, 255, .14); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .22); }

/* Panel rechts: Untertitel füllen den Platz unter der Lage, Antworten und Urteil darunter */
.dialog { display: flex; flex-direction: column; gap: 12px; align-content: stretch; min-height: 0; }
.cc { flex: 1 1 0; max-height: none; min-height: 110px; padding: 16px 18px; }
.wahl, .urteil { flex: none; }
.win { width: min(100%, 900px, calc(100cqh * 16 / 10.5)); }

/* ================= Hacker (wie in der Phishing Challenge) =================
   Lugt schräg von links ins Bild. freut = hat gewonnen (zwinkert, Funkeln, lacht),
   aergert = durchschaut (große Augen, Schweiß), gaehnt = langweilt sich (Augen halb zu, Mund auf). */
.hacker { position: fixed; left: 0; top: 21%; z-index: 40; width: clamp(150px, 15vw, 236px); pointer-events: none; }
.hacker-figur { position: relative; transform: translate3d(-125%, 0, 0) rotate(-26deg); transform-origin: 10% 85%; opacity: 0;
  transition: transform .45s cubic-bezier(.55, 0, .85, .25), opacity 0s .45s; }   /* weg: zügig sichtbar nach links hinaus, erst dann unsichtbar */
.hacker.da .hacker-figur { transform: translate3d(-40%, 0, 0) rotate(16deg); opacity: 1; transition: transform .9s cubic-bezier(.16, 1, .3, 1), opacity .2s; }
.hacker-svg { width: 100%; height: auto; display: block; overflow: visible; filter: drop-shadow(0 20px 40px rgba(0, 0, 0, .65)); }
.hacker-svg * { transform-box: fill-box; }
.hk-zwinker, .hk-funkel, .hk-schweiss, .hk-schweiss2 { opacity: 0; }
.hk-auge { transform-origin: center; }
.hk-braue-l, .hk-braue-r { transform-origin: center; transition: transform .3s; }
.hk-kopf { transform-origin: 50% 90%; }
.hk-hand-l, .hk-hand-r { transform-box: view-box; }
/* alle: einmal blinzeln */
.hacker.da .hk-auge-r { animation: hkBlinzeln 4.6s .5s both; }
@keyframes hkBlinzeln { 0%, 62%, 70%, 100% { transform: scaleY(1); } 66% { transform: scaleY(.1); } }
/* freut: Zwinkern, Funkeln, Kopf lacht mit */
.hacker.freut.da .hk-auge-l { animation: hkAugeZu 3.8s .5s both; }
.hacker.freut.da .hk-zwinker { transform-origin: center; animation: hkZwinker 3.8s cubic-bezier(.175, .885, .32, 1.275) .5s both; }
.hacker.freut.da .hk-funkel { transform-origin: center; animation: hkFunkel 3.8s cubic-bezier(.175, .885, .32, 1.275) .5s both; }
.hacker.freut.da .hk-braue-l { animation: hkBraueHoch 3.8s .5s both; }
.hacker.freut.da .hk-kopf { animation: hkLachen .32s ease-in-out 1.3s 5; }
.hacker.freut.da .hk-mund { transform-origin: center; animation: hkGrinsen 3.8s .5s both; }
@keyframes hkAugeZu { 0%, 22% { opacity: 1; transform: scaleY(1); } 26%, 100% { opacity: 0; transform: scaleY(.1); } }
@keyframes hkZwinker { 0%, 23% { opacity: 0; transform: scale(.6); } 26% { opacity: 1; transform: scale(1.15); } 32%, 100% { opacity: 1; transform: scale(1); } }
@keyframes hkFunkel { 0%, 20% { opacity: 0; transform: scale(0) rotate(-45deg); } 28% { opacity: 1; transform: scale(1.4) rotate(25deg); } 36% { transform: scale(.9) rotate(-10deg); }
  44% { transform: scale(1.25) rotate(15deg); } 60%, 82% { opacity: 1; transform: scale(1) rotate(0); } 100% { opacity: 0; transform: scale(.2) rotate(45deg); } }
@keyframes hkBraueHoch { 0%, 18%, 100% { transform: none; } 24%, 85% { transform: translateY(-7px) rotate(-6deg); } }
@keyframes hkLachen { 50% { transform: translateY(-5px) rotate(-2deg); } }
@keyframes hkGrinsen { 0%, 20%, 100% { transform: none; } 28%, 85% { transform: scale(1.15, 1.25); } }
/* aergert: große Augen, Brauen hoch, Schweißtropfen, kurzes Zucken */
.hacker.aergert.da .hk-auge-l, .hacker.aergert.da .hk-auge-r { animation: hkErschreckt 3.8s cubic-bezier(.175, .885, .32, 1.275) .5s both; }
.hacker.aergert.da .hk-braue-l { animation: hkBraueL 3.8s .5s both; }
.hacker.aergert.da .hk-braue-r { animation: hkBraueR 3.8s .5s both; }
.hacker.aergert.da .hk-schweiss { transform-origin: center; animation: hkSchweiss 3.8s cubic-bezier(.25, .46, .45, .94) .5s both; }
.hacker.aergert.da .hk-schweiss2 { transform-origin: center; animation: hkSchweiss2 3.8s ease-out .7s both; }
.hacker.aergert.da .hk-kopf { animation: hkZucken .5s ease-in-out 1.1s 1; }
.hacker.aergert.da .hk-mund { transform-origin: center; animation: hkMundAuf 3.8s .5s both; }
@keyframes hkErschreckt { 0%, 14% { transform: scale(1); } 20% { transform: scale(1.32); } 28%, 80% { transform: scale(1.18); } 90%, 100% { transform: scale(1); } }
@keyframes hkBraueL { 0%, 14%, 100% { transform: none; } 20%, 85% { transform: translateY(-9px) rotate(-8deg); } }
@keyframes hkBraueR { 0%, 14%, 100% { transform: none; } 20%, 85% { transform: translateY(-9px) rotate(8deg); } }
@keyframes hkSchweiss { 0%, 16% { opacity: 0; transform: scale(.3) translateY(-6px); } 24% { opacity: 1; transform: scale(1.15); } 35% { opacity: 1; transform: scale(1) translateY(3px); }
  75% { opacity: 1; transform: scale(1.05, 1.15) translateY(12px); } 88% { opacity: .8; transform: scale(.9, 1.2) translateY(18px); } 100% { opacity: 0; transform: scale(.4) translateY(24px); } }
