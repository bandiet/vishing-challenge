<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vishing Challenge</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="app" data-screen="s-start">

  <!-- ruhiger Hintergrund wie in der Phishing Challenge: zwei schwache Lichter (Petrol links, Magenta rechts);
       beim Sicherheitstipp Navy mit blauem Schimmer -->
  <div class="bg" aria-hidden="true">
    <div class="bg-quiz"></div>
    <div class="bg-tipp"></div>
  </div>

  <!-- HUD wie in der Serie: Marke links, rechts Hacker-Kasse, Fortschritt, Ton -->
  <header class="hud" id="hud">
    <div class="hud-pille hud-marke">
      <img class="hud-logo" src="assets/hacker-face.png" alt="">
      <span id="hud-titel"></span>
    </div>
    <div class="hud-rechts">
      <div class="hud-pille hud-beute" id="hud-beute" hidden title="Hacker-Beute">
        <img src="assets/hacker-face.png" alt="">
        <span class="hb-text"><small id="hud-beute-label"></small><b id="hud-beute-wert">0 €</b></span>
      </div>
      <div class="hud-pille hud-fortschritt" id="hud-fortschritt" hidden>
        <span class="hud-level" id="hud-level"></span>
        <span class="hud-frage"><span id="hud-anruf"></span><span class="hud-segmente" id="hud-punkte"></span></span>
      </div>
      <button class="icon-btn" id="btn-ton" type="button" aria-pressed="true" title="Ton">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="ton-an" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="ton-aus" d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
    </div>
  </header>

  <main class="buehne-app" id="buehne-app">

  <!-- ============ Start ============ -->
  <section id="s-start" class="screen screen-start zentriert" aria-labelledby="start-titel">
    <div class="sternenflug" id="sternenflug" aria-hidden="true"></div>
    <div class="inhalt start">
      <h1 id="start-titel" class="mega"></h1>
      <div class="start-visual" aria-hidden="true">
        <canvas id="start-welle" class="welle"></canvas>
        <div class="welle-labels"><span>Mensch</span><span>Maschine</span></div>
      </div>
      <p class="lead" id="start-kern"></p>
      <div class="start-aktion"><button id="start-los" class="btn btn-gross btn-mint btn-winkt" type="button"></button></div>
      <ul class="start-fakten" id="start-fakten"></ul>
    </div>
  </section>

  <!-- ============ Intro ============ -->
  <section id="s-intro" class="screen screen-intro" hidden>
    <p class="kit-kopf" id="kit-kopf"><i></i><span></span></p>
    <div class="intro-buehne">
      <div class="beat" id="beat">
        <h2 class="beat-gross" id="beat-gross"></h2>
        <div class="beat-medium" id="beat-medium">
          <div class="rec" id="rec">
            <div class="rec-kopf"><span class="rec-punkt"></span><span>REC</span><b id="rec-zeit">00:00.0</b></div>
            <canvas id="rec-welle" class="rec-welle" aria-hidden="true"></canvas>
          </div>
        </div>
        <p class="beat-klein" id="beat-klein"></p>
        <p class="beat-ergebnis" id="beat-ergebnis"></p>
      </div>
    </div>
    <button id="intro-skip" class="btn-text skip" type="button"></button>
  </section>

  <!-- ============ Level-Start ============ -->
  <section id="s-level" class="screen screen-level zentriert" hidden>
    <div class="inhalt intro-level">
      <div><span class="pille-kicker" id="lv-kicker"></span></div>
      <div class="lv-icon" id="lv-icon"><span class="lv-zahl" id="lv-zahl">0</span></div>
      <h1 class="titel-gross" id="lv-titel"></h1>
      <p class="untertitel" id="lv-unter"></p>
      <div class="lv-info" id="lv-info"></div>
      <button class="btn btn-gross btn-mint" id="lv-los" type="button"></button>
    </div>
  </section>

  <!-- ============ Spiel: links das Gerät, rechts oben die Lage, darunter die Live-Untertitel ============ -->
  <section id="s-spiel" class="screen screen-spiel" hidden>
    <div class="buehne" id="buehne">
      <!-- Gerät -->
      <div class="geraet-spalte">
        <div class="geraet" id="geraet" data-art="phone" data-zustand="ruhe">
          <!-- Telefon -->
          <div class="phone">
            <div class="phone-status"><span id="ph-uhr">16:52</span><span class="phone-notch"></span><span class="phone-icons"><i></i><i></i><i></i></span></div>
            <div class="phone-sperre">
              <span class="sperre-uhr" id="ph-sperre-uhr"></span>
              <span class="sperre-datum" id="ph-sperre-datum"></span>
            </div>
            <div class="phone-anruf">
              <p class="ph-kanal" id="ph-kanal"></p>
              <div class="ph-avatar-wrap">
                <canvas class="ph-ring" id="ph-ring" width="320" height="320" aria-hidden="true"></canvas>
                <div class="ph-avatar" id="ph-avatar"></div>
              </div>
              <p class="ph-name" id="ph-name"></p>
              <p class="ph-zeile" id="ph-zeile"></p>
              <p class="ph-timer" id="ph-timer"></p>
            </div>
            <div class="phone-tasten phone-tasten-ring">
              <div class="taste"><button class="rund rund-nein" id="ph-ablehnen" type="button" aria-label="Ablehnen"><svg class="ico" viewBox="0 0 24 24"><path class="fill" d="M3.5 13.6c4.7-4.1 12.3-4.1 17 0l-1.8 2.5c-.4.5-1.1.6-1.6.3l-2.2-1.3c-.4-.2-.6-.7-.5-1.1l.3-1.6a10.6 10.6 0 0 0-5.4 0l.3 1.6c.1.4-.1.9-.5 1.1l-2.2 1.3c-.5.3-1.2.2-1.6-.3z"/></svg></button><span>Ablehnen</span></div>
              <div class="taste"><button class="rund rund-ja" id="ph-annehmen" type="button" aria-label="Annehmen"><svg class="ico" viewBox="0 0 24 24"><path class="fill" d="M6.6 3.2 8.8 5c.4.3.5.9.3 1.4L8 8.8a12 12 0 0 0 7.2 7.2l2.4-1.1c.5-.2 1-.1 1.4.3l1.8 2.2c.4.5.3 1.2-.2 1.6l-1.6 1.3c-.9.7-2.1.9-3.1.5A18.4 18.4 0 0 1 3.2 8.2c-.4-1-.2-2.2.5-3.1L5 3.4c.4-.5 1.1-.6 1.6-.2z"/></svg></button><span>Annehmen</span></div>
            </div>
            <div class="phone-tasten phone-tasten-talk">
              <span class="rund rund-deko" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
              <button class="rund rund-nein" id="ph-auflegen" type="button" aria-label="Auflegen"><svg class="ico" viewBox="0 0 24 24"><path class="fill" d="M3.5 13.6c4.7-4.1 12.3-4.1 17 0l-1.8 2.5c-.4.5-1.1.6-1.6.3l-2.2-1.3c-.4-.2-.6-.7-.5-1.1l.3-1.6a10.6 10.6 0 0 0-5.4 0l.3 1.6c.1.4-.1.9-.5 1.1l-2.2 1.3c-.5.3-1.2.2-1.6-.3z"/></svg></button>
              <span class="rund rund-deko" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></span>
            </div>
          </div>

          <!-- Teams-artiges Fenster: vor dem Anruf der Posteingang, im Anruf das Anruffenster
               (Steuerung oben rechts wie im aktuellen Teams, Name unten links in der Kachel) -->
          <div class="win">
            <div class="win-titel">
              <span class="win-dots"><i></i><i></i><i></i></span>
              <div class="win-app"><span class="win-suche"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>Suchen</span></div>
              <div class="win-call">
                <span class="win-call-info"><b id="win-timer">00:00</b><span id="win-call-name"></span></span>
                <div class="win-steuer">
                  <span class="wsym wsym-extra" aria-hidden="true" title="Chat"><svg class="ico" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></span>
                  <span class="wsym wsym-extra" aria-hidden="true" title="Personen"><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-4 3.4-6 6.5-6s5.7 2 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14c2.6.2 4.4 2 5 5"/></svg></span>
                  <span class="wsym wsym-extra" aria-hidden="true" title="Mehr"><svg class="ico" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1" class="fill"/><circle cx="12" cy="12" r="1" class="fill"/><circle cx="19" cy="12" r="1" class="fill"/></svg></span>
                  <span class="wtrenner wsym-extra" aria-hidden="true"></span>
                  <span class="wsym wsym-aus" aria-hidden="true" title="Kamera aus"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/><path d="M3 3l18 18"/></svg></span>
                  <span class="wsym" aria-hidden="true" title="Mikrofon"><svg class="ico" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
                  <span class="wsym" aria-hidden="true" title="Teilen"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 14V8m-3 3 3-3 3 3M8 21h8"/></svg></span>
                  <button class="wbtn-auflegen" id="win-auflegen" type="button"><svg class="ico" viewBox="0 0 24 24"><path class="fill" d="M3.5 13.6c4.7-4.1 12.3-4.1 17 0l-1.8 2.5c-.4.5-1.1.6-1.6.3l-2.2-1.3c-.4-.2-.6-.7-.5-1.1l.3-1.6a10.6 10.6 0 0 0-5.4 0l.3 1.6c.1.4-.1.9-.5 1.1l-2.2 1.3c-.5.3-1.2.2-1.6-.3z"/></svg><span>Auflegen</span></button>
                </div>
              </div>
            </div>
            <div class="win-body">
              <div class="win-leer" id="win-leer">
                <p class="mail-kopf"><span>Posteingang</span><b id="win-mails">0</b><em id="win-mails-neu"></em></p>
                <ul class="mails" id="win-mail-liste"></ul>
              </div>
              <div class="win-kachel">
                <div class="ph-avatar-wrap">
                  <canvas class="ph-ring" id="win-ring" width="320" height="320" aria-hidden="true"></canvas>
                  <div class="ph-avatar" id="win-avatar"></div>
                </div>
                <p class="win-zeile" id="win-zeile"></p>
              </div>
              <p class="win-namensschild"><svg class="ico" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span id="win-name"></span><span class="pill-extern" id="win-extern" hidden>Extern</span></p>
              <div class="win-selbst" aria-hidden="true"><span>Du</span></div>
              <div class="win-toast" id="win-toast">
                <div class="win-toast-kopf"><div class="ph-avatar klein" id="win-toast-avatar"></div><div><p class="win-toast-name" id="win-toast-name"></p><p class="win-toast-zeile" id="win-toast-zeile"></p></div></div>
                <div class="win-toast-tasten">
                  <button class="trund trund-ja" id="win-annehmen" type="button" aria-label="Mit Audio annehmen" title="Mit Audio annehmen"><svg class="ico" viewBox="0 0 24 24"><path class="fill" d="M6.6 3.2 8.8 5c.4.3.5.9.3 1.4L8 8.8a12 12 0 0 0 7.2 7.2l2.4-1.1c.5-.2 1-.1 1.4.3l1.8 2.2c.4.5.3 1.2-.2 1.6l-1.6 1.3c-.9.7-2.1.9-3.1.5A18.4 18.4 0 0 1 3.2 8.2c-.4-1-.2-2.2.5-3.1L5 3.4c.4-.5 1.1-.6 1.6-.2z"/></svg></button>
                  <button class="trund trund-nein" id="win-ablehnen" type="button" aria-label="Ablehnen" title="Ablehnen"><svg class="ico" viewBox="0 0 24 24"><path class="fill" d="M3.5 13.6c4.7-4.1 12.3-4.1 17 0l-1.8 2.5c-.4.5-1.1.6-1.6.3l-2.2-1.3c-.4-.2-.6-.7-.5-1.1l.3-1.6a10.6 10.6 0 0 0-5.4 0l.3 1.6c.1.4-.1.9-.5 1.1l-2.2 1.3c-.5.3-1.2.2-1.6-.3z"/></svg></button>
                </div>
              </div>
            </div>
          </div>
          <p class="geraet-ende" id="geraet-ende" hidden></p>
        </div>
        <p class="ablehnen-tipp" id="ablehnen-tipp" hidden></p>
      </div>

      <!-- Lage -->
      <aside class="lage karte" id="lage">
        <div class="lage-kopf"><span class="lage-tag" id="lage-tag"></span><span class="lage-zeit" id="lage-zeit"></span></div>
        <h2 class="lage-titel" id="lage-titel"></h2>
        <p class="lage-text" id="lage-text"></p>
        <button class="lage-toggle" id="lage-toggle" type="button" aria-expanded="true">Lage</button>
      </aside>

      <!-- Dialog: Untertitel, Antworten, Urteil -->
      <div class="dialog" id="dialog">
        <div class="cc karte" id="cc">
          <div class="cc-kopf">
            <button class="cc-schalter" id="cc-schalter" type="button" role="switch" aria-checked="false"><i class="cc-punkt"></i><span>Live-Untertitel</span><span class="schalter" aria-hidden="true"></span></button>
            <button class="btn-text cc-nochmal" id="cc-nochmal" type="button" hidden>↺ Nochmal hören</button>
          </div>
          <div class="cc-log" id="cc-log" aria-live="polite"><p class="cc-leer" id="cc-leer">Noch kein Gespräch.</p></div>
        </div>
        <div class="wahl" id="wahl" hidden>
          <p class="wahl-label" id="wahl-label"></p>
          <div class="wahl-optionen" id="wahl-optionen"></div>
        </div>
        <!-- Urteil im Panel, wie die Antwortknöpfe der Serie -->
        <div class="urteil karte" id="urteil" hidden>
          <p class="urteil-sub" id="urteil-sub"></p>
          <h2 class="urteil-frage" id="urteil-frage"></h2>
          <div class="urteil-tasten">
            <button class="urteil-btn echt" id="urteil-echt" type="button">
              <svg class="ico" viewBox="0 0 48 48"><circle cx="24" cy="16" r="8"/><path d="M8 42c1.5-9 8-14 16-14s14.5 5 16 14"/></svg>
              <b></b><span></span><kbd>←</kbd>
            </button>
            <button class="urteil-btn fake" id="urteil-fake" type="button">
              <svg class="ico" viewBox="0 0 48 48"><rect x="10" y="12" width="28" height="24" rx="6"/><path d="M24 12V6M18 22h.01M30 22h.01M18 30h12"/><circle cx="24" cy="5" r="2"/></svg>
              <b></b><span></span><kbd>→</kbd>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Feedback -->
    <div class="overlay feedback" id="feedback" hidden>
      <div class="fb-blatt" id="fb-blatt">
        <div class="fb-kopf">
          <div class="stempel" id="fb-stempel"></div>
          <div class="fb-kopf-text">
            <p class="kicker" id="fb-kicker"></p>
            <h2 class="fb-titel" id="fb-titel"></h2>
            <p class="fb-sub" id="fb-sub"></p>
          </div>
          <div class="fb-punkte" id="fb-punkte"></div>
        </div>
        <div class="hacker-sagt" id="fb-hacker"><img src="assets/hacker.png" alt=""><p id="fb-hacker-text"></p></div>
        <div class="kern" id="fb-kern"><span class="kern-label" id="fb-kern-label"></span><p id="fb-kern-text"></p></div>
        <section class="fb-zeile">
          <h3><span id="fb-signale-titel"></span><small id="fb-antippen"></small></h3>
          <div class="chips" id="fb-signale" role="list"></div>
          <div class="chip-detail" id="fb-signal-detail" hidden></div>
        </section>
        <section class="fb-zeile">
          <h3><span id="fb-zuege-titel"></span></h3>
          <div class="zuege" id="fb-zuege"></div>
        </section>
        <div class="fb-fuss">
          <p class="tipp" id="fb-tipp"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.6 3.1 8.3 7.5 9.5 4.4-1.2 7.5-4.9 7.5-9.5V6z"/><path d="m8.8 12.2 2.2 2.2 4.4-4.6"/></svg><span><b id="fb-tipp-titel"></b> <span id="fb-tipp-text"></span></span></p>
          <button class="btn" id="fb-weiter" type="button"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ Level-Auswertung ============ -->
  <section id="s-levelende" class="screen screen-levelende zentriert" hidden>
    <div class="inhalt"><div class="le-karte karte" id="le-karte"></div></div>
  </section>

  <!-- ============ Sicherheitstipp: erst das Vishing-Nugget, dann die Frage ============ -->
  <section id="s-pause" class="screen screen-pause zentriert" hidden>
    <div class="pause-inner">
      <p class="kicker" id="pause-kicker"></p>
      <h2 class="titel" id="pause-titel"></h2>
      <div class="nugget" id="nugget">
        <p class="nugget-lead" id="nugget-lead"></p>
        <div class="nugget-karte" id="nugget-karte" aria-live="polite"></div>
        <div class="nugget-nav">
          <div class="nugget-punkte" id="nugget-punkte"></div>
          <button class="btn-text" id="nugget-zurueck" type="button"></button>
          <button class="btn btn-mint" id="nugget-weiter" type="button"></button>
        </div>
      </div>
      <div class="pause-quiz" id="pause-quiz" hidden>
        <p class="pause-szene" id="pause-szene"></p>
        <p class="pause-frage" id="pause-frage"></p>
        <div class="pause-optionen" id="pause-optionen"></div>
        <div class="pause-antwort" id="pause-antwort" hidden>
          <h3 id="pause-antwort-titel"></h3>
          <p id="pause-antwort-text"></p>
        </div>
        <div class="regel" id="pause-regel" hidden>
          <h3 id="pause-regel-titel"></h3>
          <ol class="regel-punkte" id="pause-regel-punkte"></ol>
        </div>
        <button class="btn" id="pause-weiter" type="button" hidden></button>
      </div>
    </div>
  </section>

  <!-- ============ Auswertung ============ -->
  <section id="s-ende" class="screen screen-ende zentriert" hidden>
    <div class="inhalt finale" id="finale"></div>
  </section>

  </main>

  <canvas class="feier" id="feier" aria-hidden="true"></canvas>
</div>

<script src="js/content.js"></script>
<script src="js/klang.js"></script>
<script src="js/feier.js"></script>
<script src="js/app.js"></script>
</body>
</html>
